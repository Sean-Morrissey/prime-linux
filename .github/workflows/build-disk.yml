---
name: Build disk images

# Produces installable media straight from CI, so nobody needs podman, the
# bluebuild CLI or sudo on their own machine to see the real thing:
#   * qcow2        — boot it directly in QEMU, no install step (fastest feedback)
#   * anaconda-iso — what gets flashed to a USB stick for real hardware
#
# Runs after the image build (build.yml) has published ghcr.io/<owner>/prime-linux.

on:
  workflow_dispatch:
    inputs:
      platform:
        required: true
        type: choice
        options:
          - amd64
          - arm64
  pull_request:
    branches:
      - main
    paths:
      - "./disk_config/disk.toml"
      - "./disk_config/iso.toml"
      - "./.github/workflows/build-disk.yml"

env:
  IMAGE_NAME: prime-linux # must match recipes/recipe.yml `name:` and build.yml
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}" # do not edit
  DEFAULT_TAG: "latest"
  BIB_IMAGE: "quay.io/centos-bootc/bootc-image-builder:latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build disk images
    runs-on: ${{ inputs.platform == 'arm64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    strategy:
      fail-fast: false # a failing ISO leg must not hide a good qcow2
      matrix:
        disk-type: ["qcow2", "anaconda-iso"]
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          USER_UID=$(id -u)
          USER_GID=$(id -g)
          DISK_TYPE=$(echo "${{ matrix.disk-type }}" | tr ' ' '-')
          # GHCR repository paths are lowercase-only
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
          echo "DISK_TYPE=${DISK_TYPE}" >> ${GITHUB_ENV}
          echo "USER_UID=${USER_UID}" >> ${GITHUB_ENV}
          echo "USER_GID=${USER_GID}" >> ${GITHUB_ENV}

      - name: Maximize build space
        if: inputs.platform != 'arm64'
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          extra-squeeze: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The repo (and therefore the image) is private, so the builder has to
      # authenticate before it can pull or it fails with a 401. The builder runs
      # podman as root, so this has to be root's podman that gets the credential —
      # logging in as the runner user is not enough, and that mistake looks like
      # "Failed to pull image: exit code 125". The `packages: read` permission above is
      # what makes this login valid; without it the error reads like bad credentials.
      - name: Log in to GHCR for the builder
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      # This step does NOT currently succeed: the qcow2 leg dies mounting the container
      # storage inside the builder and the ISO leg dies mounting /dev into its build
      # tree. docs/DISK-BUILD-DEBUG.md has the exact call, everything already ruled out
      # (runner, capabilities, auth, the mount itself, the action's config), and the one
      # experiment left — .github/workflows/diag-builder.yml. Do not re-litigate it from
      # the log text; the log suggests causes the environment has already disproved.
      - name: Build disk images
        id: build
        uses: osbuild/bootc-image-builder-action@8661cd3832544ad68c12dcde8681b13ab0f56a8d # main
        with:
          builder-image: ${{ env.BIB_IMAGE }}
          config-file: ${{ matrix.disk-type == 'anaconda-iso' && './disk_config/iso.toml' || './disk_config/disk.toml' }}
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}
          chown: ${{ env.USER_UID }}:${{ env.USER_GID }}
          types: ${{ matrix.disk-type }}
          # Restored. It was removed during an earlier, wrong diagnosis that blamed it for
          # the storage mount failure; the failure is unchanged without it, and the only
          # build that has ever succeeded on these runners had it.
          additional-args: --use-librepo=True

      - name: Upload disk images and checksum as job artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # explicit per-leg names: both matrix legs uploading as the default
          # "artifact" collides, and then the VM fetch grabs whichever won
          name: prime-linux-${{ matrix.disk-type }}
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: true
