---
# The next experiment for the disk build, kept as a file so nobody re-derives it.
# Findings and what has already been ruled out: docs/DISK-BUILD-DEBUG.md.
#
# Four legs, ONE variable each. Order matters — each leg adds or removes exactly one
# thing against the known failure (our image, host pre-pull, no extra flags, storage
# volume — the shape build-disk.yml uses today):
#   A  ours, pre-pulled, no extra flags     — expected to reproduce the mount failure
#   B  ours, pre-pulled, + --use-librepo    — is the missing flag the difference?
#   C  ours, pre-pulled, + --rootfs btrfs + --use-librepo  — the full flag set round 7 won with
#   D  public fedora-bootc, pre-pulled, + --rootfs ext4 + --use-librepo — KNOWN-GOOD control
#
# --rootfs is not optional for fedora-bootc: it does not declare a default rootfs and
# BIB dies with "failed to initialize bootc distro: missing required info: DefaultRootFs"
# before it reaches anything interesting. That is why leg D carries it too — an earlier
# version of this file omitted it and the control failed for an unrelated reason, which
# wasted the whole run. Say it plainly: without --rootfs the control tests nothing.
#
# Read D first. D fails → the environment regressed and nothing here is about our image.
# D passes and C fails → the difference is our image (ublue/Aurora-derived); compare its
# storage/driver metadata next. D passes and C passes → the flags are the whole fix.
#
# Two rules this workflow exists to honour:
#   * `permissions: packages: read` — without it the GHCR login is refused and every
#     leg dies before reaching the part under test (that is what ruined run 35649008504:
#     `failed to inspect the image: exit status 125`, which looks like a build failure
#     and is actually bad credentials).
#   * `set -o pipefail` + explicit `exit $rc` — a piped step once reported green jobs
#     for builds that had exited 1. A green tick must mean an image exists.
name: diag builder

on:
  workflow_dispatch:

jobs:
  bisect:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: A-ours-no-flags
            src: ghcr.io/sean-morrissey/prime-linux:latest
            extra: ""
          - name: B-ours-librepo
            src: ghcr.io/sean-morrissey/prime-linux:latest
            extra: "--use-librepo=True"
          - name: C-ours-full-flags
            src: ghcr.io/sean-morrissey/prime-linux:latest
            extra: "--rootfs btrfs --use-librepo=True"
          - name: D-public-control
            src: quay.io/fedora/fedora-bootc:latest
            extra: "--rootfs ext4 --use-librepo=True"
    name: ${{ matrix.name }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Credentials the builder can use
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io \
            -u "${{ github.actor }}" --password-stdin --authfile /root/ghcr-auth.json

      - name: Pre-pull into host storage (what the action does)
        run: sudo podman pull -q "${{ matrix.src }}"

      - name: Show what the host storage holds
        run: sudo podman images --format '{{.Repository}}:{{.Tag}}'

      - name: Build the qcow2
        run: |
          mkdir -p out
          set +e
          sudo podman run --rm --privileged --security-opt label=type:unconfined_t \
            --volume /var/lib/containers/storage:/var/lib/containers/storage \
            --volume /root/ghcr-auth.json:/root/.config/containers/auth.json:ro \
            --volume "$PWD/out:/output" \
            --volume "$PWD/disk_config/disk.toml:/config.toml:ro" \
            quay.io/centos-bootc/bootc-image-builder:latest \
            build --output /output --chown "$(id -u):$(id -g)" --type qcow2 \
            ${{ matrix.extra }} \
            "${{ matrix.src }}" 2>&1 | tail -25
          rc=${PIPESTATUS[0]}
          echo "=== BIB EXIT: $rc ==="
          find out -type f -printf '%p  %s bytes\n' 2>/dev/null
          exit $rc
