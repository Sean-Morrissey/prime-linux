---
# Throwaway diagnostic, round 6. Round 5 proved the exact osbuild invocation
#   mount --make-private -o rbind,rw,0755 /var/lib/containers/storage <target>
# succeeds in a clean container (WHOLE_OK). The only state difference in the real
# build is that root's container storage is POPULATED — the source image has been
# pulled, so the tree contains live overlay mounts that the rbind has to clone.
# Pull first, then repeat the identical call.
name: diag populated storage

on:
  workflow_dispatch:

jobs:
  populated:
    runs-on: ubuntu-26.04
    steps:
      - name: empty storage (control)
        run: |
          sudo podman run --rm --privileged --security-opt label=type:unconfined_t \
            --volume /var/lib/containers/storage:/var/lib/containers/storage \
            --entrypoint /bin/sh quay.io/centos-bootc/bootc-image-builder:latest -c '
              mkdir -p /run/osbuild/containers/storage
              mount --make-private -o rbind,rw,0755 /var/lib/containers/storage /run/osbuild/containers/storage \
                && echo EMPTY_WHOLE_OK || echo EMPTY_WHOLE_FAILED
              umount -l /run/osbuild/containers/storage 2>/dev/null
              echo "overlay mounts visible: $(grep -c overlay /proc/self/mountinfo)"
            '

      - name: pull an image into root storage
        run: |
          sudo podman pull -q quay.io/fedora/fedora-bootc:latest
          sudo podman images --format '{{.Repository}}:{{.Tag}}'

      - name: same call, populated storage
        run: |
          sudo podman run --rm --privileged --security-opt label=type:unconfined_t \
            --volume /var/lib/containers/storage:/var/lib/containers/storage \
            --entrypoint /bin/sh quay.io/centos-bootc/bootc-image-builder:latest -c '
              mkdir -p /run/osbuild/containers/storage
              mount --make-private -o rbind,rw,0755 /var/lib/containers/storage /run/osbuild/containers/storage \
                && echo POPULATED_WHOLE_OK || echo POPULATED_WHOLE_FAILED
              echo "overlay mounts visible: $(grep -c overlay /proc/self/mountinfo)"
              echo "--- overlay lines from storage ---"
              grep overlay /proc/self/mountinfo | head -3
            '

      - name: can this podman even mount the image, the way BIB does
        run: |
          sudo podman run --rm --privileged --security-opt label=type:unconfined_t \
            --volume /var/lib/containers/storage:/var/lib/containers/storage \
            --entrypoint /bin/sh quay.io/centos-bootc/bootc-image-builder:latest -c '
              podman --root /var/lib/containers/storage images --format "{{.Repository}}:{{.Tag}}" | head -5
              echo "--- try mounting it ---"
              ctr=$(podman --root /var/lib/containers/storage create quay.io/fedora/fedora-bootc:latest /bin/true 2>&1 | tail -1)
              echo "create said: $ctr"
              podman --root /var/lib/containers/storage mount "$ctr" 2>&1 | tail -3
            '
