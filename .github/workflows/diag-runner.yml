---
# Throwaway diagnostic, round 4: the same action, the same config, two runner images.
# Rounds 1-3 proved the runner can do everything osbuild needs (privileged root, no
# user namespace, full capabilities, the storage bind mount succeeds interactively),
# yet the real build fails inside bootc-image-builder at that same bind mount. So run
# the actual action against a PUBLIC image on both runner images and see which one
# gets further. No login anywhere: the variable under test is the runner, nothing else.
name: diag runner A/B

on:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: kernel and podman
        run: |
          uname -r
          podman --version
          sudo podman info --format 'driver={{.Store.GraphDriverName}}'

      - name: Build disk images (public fedora-bootc, no auth)
        id: build
        uses: osbuild/bootc-image-builder-action@8661cd3832544ad68c12dcde8681b13ab0f56a8d # main
        with:
          builder-image: quay.io/centos-bootc/bootc-image-builder:latest
          config-file: ./disk_config/disk.toml
          image: quay.io/fedora/fedora-bootc:latest
          chown: "1001:1001"
          types: qcow2

      - name: Did it produce anything?
        if: always()
        run: ls -la out/ 2>/dev/null || ls -la ${{ steps.build.outputs.output-directory }} 2>/dev/null || echo "no output directory"
