---
# Throwaway diagnostic, round 3. Round 2 proved a --privileged container on this
# runner CAN mount tmpfs and chown, before and after a root podman login. So the
# failure is specific to what osbuild does: bind-mounting the container storage
#   osbuild/util/containers.py:131 containers_storage_source
#   osbuild/util/mnt.py:88 mount(...)  ->  mount: /run/osbuild/containers/storage:
#                                          permission denied
# Reproduce that exact call, with and without the storage volume present, and print
# the namespace/capability state at that moment.
name: diag storage bind mount

on:
  workflow_dispatch:

jobs:
  bind:
    runs-on: ubuntu-26.04
    steps:
      - name: who am I and what can I do inside the builder
        run: |
          sudo podman run --rm --privileged --security-opt label=type:unconfined_t \
            --entrypoint /bin/sh quay.io/centos-bootc/bootc-image-builder:latest -c '
              echo "id: $(id)"
              echo "--- uid_map (a user namespace shows a non-trivial map) ---"
              cat /proc/self/uid_map
              echo "--- capabilities ---"
              capsh --print 2>/dev/null | head -3 || grep Cap /proc/self/status
            '

      - name: bind-mount the storage, exactly like osbuild does (with the volume)
        run: |
          sudo podman run --rm --privileged --security-opt label=type:unconfined_t \
            --volume /var/lib/containers/storage:/var/lib/containers/storage \
            --entrypoint /bin/sh quay.io/centos-bootc/bootc-image-builder:latest -c '
              mkdir -p /run/osbuild/containers/storage
              mount --bind /var/lib/containers/storage /run/osbuild/containers/storage \
                && echo BIND_OK || echo "BIND_FAILED rc=$?"
              echo "--- mountinfo for the source ---"
              grep containers/storage /proc/self/mountinfo | head -3
            '

      - name: same bind mount, without the volume present
        run: |
          sudo podman run --rm --privileged --security-opt label=type:unconfined_t \
            --entrypoint /bin/sh quay.io/centos-bootc/bootc-image-builder:latest -c '
              mkdir -p /var/lib/containers/storage /run/osbuild/containers/storage
              mount --bind /var/lib/containers/storage /run/osbuild/containers/storage \
                && echo BIND_OK_NO_VOLUME || echo "BIND_FAILED_NO_VOLUME rc=$?"
            '

      - name: does the builder see a Fedora 44 image to work from
        run: |
          sudo podman pull -q quay.io/fedora/fedora-bootc:latest >/dev/null 2>&1 || true
          sudo podman images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | head -5
