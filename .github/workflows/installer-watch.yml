# Is the CachyOS installer usable again? (docs/BUILD-STATE-2026-09-27.md → "The blocker")
#
# cachyos-calamares-next was built against libboost_python of one Boost version while
# the repos moved on to the next, so the installer on every CachyOS ISO fails to start
# and Prime's own ISO track waits on it. This looks — weekly, or on demand — at the
# package CachyOS ships now and at the Boost the repos ship now, and says in the job
# summary whether they match. Nothing is built, nothing is pushed.
name: installer watch
on:
  schedule:
    - cron: "17 6 * * 1"          # Mondays
  workflow_dispatch:
  pull_request:                   # a change to this watcher runs it once, so it's never untested
    paths: [".github/workflows/installer-watch.yml"]
permissions:
  contents: read

jobs:
  check:
    name: Does CachyOS's installer start with today's Boost?
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Look
        shell: bash
        run: |
          set -uo pipefail
          pacman -Sy --noconfirm --needed binutils libarchive curl >/dev/null
          repo=https://mirror.cachyos.org/repo/x86_64/cachyos
          pkg="$(curl -fsSL "$repo/" | grep -oE 'cachyos-calamares-next-[0-9][^"<>]*-x86_64\.pkg\.tar\.zst' | sort -uV | tail -1)"
          [ -n "$pkg" ] || { echo "::error::couldn't find cachyos-calamares-next in $repo"; exit 1; }
          curl -fsSL -o /tmp/cal.pkg "$repo/$pkg"
          mkdir -p /tmp/cal && bsdtar -xf /tmp/cal.pkg -C /tmp/cal 'usr/lib/*' 2>/dev/null
          need="$(find /tmp/cal -name 'libcalamares*.so*' -type f -exec readelf -d {} + 2>/dev/null \
                  | grep -oE 'libboost_python[0-9]*\.so\.[0-9.]+' | sort -u | head -1)"
          needv="$(sed -E 's/.*\.so\.//' <<<"$need")"
          have="$(pacman -Si boost-libs 2>/dev/null | awk -F': ' '/^Version/ {print $2; exit}')"
          havev="$(sed -E 's/-[0-9]+$//' <<<"$have")"
          {
            echo "### CachyOS installer vs. Boost"
            echo "| | |"; echo "|---|---|"
            echo "| installer package | \`$pkg\` |"
            echo "| it needs | \`${need:-unknown}\` |"
            echo "| Arch ships boost-libs | \`${have:-unknown}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$needv" ] || [ -z "$havev" ]; then
            echo "**Couldn't tell** — the package layout changed; look by hand." >> "$GITHUB_STEP_SUMMARY"; exit 1
          elif [ "$needv" = "$havev" ]; then
            echo "**Unblocked** — the installer links the Boost the repos ship. Rebuild the ISO (docs/BUILD-STATE-2026-09-27.md → How to resume)." >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::CachyOS installer unblocked: needs $needv, repos ship $havev"
          else
            echo "**Still blocked** — needs Boost $needv, the repos ship $havev. Nothing to do yet." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::CachyOS installer still blocked: needs Boost $needv, repos ship $havev"
          fi
