# Prime will not restart the machine while any of these are running.
#
# The rule behind the list: a restart is free only when it would cost nobody
# anything. A build, an encode, a download or a print has state worth keeping, and
# none of them survive a reboot. Command names, one per line, matched exactly.
# Add your own here — a game, a compile, a long-running job.

# builds
make
ninja
cc1
cc1plus
rustc
cargo
go
gradle
mvn

# media and long jobs
ffmpeg
HandBrakeCLI
obs

# package managers (another one is already working — do not fight it)
pacman
dnf
rpm-ostree
bootc
apt

# containers and virtual machines
podman
docker
qemu-system-x86
virt-manager

# creative tools
blender
orca-slicer
prusa-slicer
CuraEngine
FreeCAD

# 3D printing: a print must never be interrupted by an update
klipper
moonraker
elegoo
