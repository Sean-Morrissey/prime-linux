# Prime AI add-on — shortcuts
bindd = SUPER SHIFT, space, Ask Prime, exec, ~/.local/share/prime-linux/layer/addons/ai/bin/prime-ask --box
bindd = SUPER ALT, A, Snip a region and ask Prime about it, exec, ~/.local/share/prime-linux/layer/bin/prime-snip area --ask
bindd = SUPER ALT, L, Show Prime's last answer, exec, ~/.local/share/prime-linux/layer/addons/ai/bin/prime-ask --last
# Someone other than Prime — Claude, Gemini, ChatGPT. Read-only second opinions:
# they get the question, never the toolbox that can change this computer.
bindd = SUPER SHIFT, G, Ask someone else (Claude · Gemini · ChatGPT), exec, ~/.local/share/prime-linux/layer/addons/ai/bin/ask-ai --pick
