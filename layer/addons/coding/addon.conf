# Coding pack — read by prime-addon (see docs/PACKS.md for every field).
KIND=pack
TITLE="Coding"
ICON="󰅩"
DESCRIPTION="Code - OSS editor, git with a friendly setup, any language on request (mise), containers (Podman), a Projects folder"
# Editor: Code - OSS ("code", official repos) — the open-source build of VS Code, so
# tutorials match; extensions come from Open VSX. Zed is one click away ("Get more").
# Containers: rootless Podman (no daemon, no admin group). Docker on request.
PACKAGES="code git github-cli mise podman podman-compose lazygit git-delta starship zoxide eza bat fzf ripgrep"
SETUP="bin/prime-coding setup"
TEARDOWN="bin/prime-coding teardown"
CHECK="bin/prime-coding check"
