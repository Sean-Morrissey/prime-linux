# Creator pack — read by prime-addon (see docs/PACKS.md for every field).
KIND=pack
TITLE="Creator"
ICON="󰄄"
DESCRIPTION="Kdenlive, Blender, Krita, GIMP, OBS and Audacity — with your graphics card doing the video encoding"
PACKAGES="kdenlive blender krita gimp obs-studio audacity ffmpeg libva-utils mediainfo kimageformats qt6-imageformats noise-suppression-for-voice"
# Hardware video encode/decode. AMD: Mesa already includes it (VA-API).
# Intel: the media driver + oneVPL runtime (Quick Sync in OBS).
# NVIDIA: NVENC comes with the driver; this adds VA-API decode for browsers/players.
PACKAGES_INTEL="intel-media-driver vpl-gpu-rt"
PACKAGES_NVIDIA="libva-nvidia-driver"
# Blender GPU rendering (HIP / CUDA / oneAPI) is large, so it's a menu row
# ("GPU rendering for Blender") that shows the download size first.
SETUP="bin/prime-creator setup"
CHECK="bin/prime-creator check"
