# Prime creator pack — shortcuts (on while the pack is on).
# (No idle rule needed: OBS keeps the screen awake itself while it records or streams.)
bindd = SUPER ALT, V, Creator menu, exec, ~/.local/share/prime-linux/layer/bin/prime-menu --section creator
bindd = SUPER ALT, R, Open OBS Studio (record the screen), exec, ~/.local/share/prime-linux/layer/bin/prime-addon open obs
