# Gaming pack — read by prime-addon (see docs/PACKS.md for every field).
KIND=pack
TITLE="Gaming"
ICON="󰊗"
DESCRIPTION="Steam with Proton, Lutris and Heroic, GameMode, an FPS overlay and a Performance mode switch"
NEEDS_MULTILIB=1
# steam pulls steam-devices (controller rules for Xbox/PlayStation/Switch/Steam pads)
PACKAGES="steam gamemode lib32-gamemode mangohud lib32-mangohud gamescope vulkan-tools"
# Vulkan drivers, 64- and 32-bit, installed in the same step as Steam so pacman
# never has to guess which one you need. The NVIDIA driver itself is CachyOS's job.
PACKAGES_AMD="vulkan-radeon lib32-vulkan-radeon"
PACKAGES_INTEL="vulkan-intel lib32-vulkan-intel"
PACKAGES_NVIDIA="nvidia-utils lib32-nvidia-utils"
PACKAGES_NOUVEAU="vulkan-nouveau lib32-vulkan-nouveau"
PACKAGES_NONE="vulkan-swrast lib32-vulkan-swrast"
# CachyOS repositories only (skipped on plain Arch): Proton-CachyOS, its gaming
# runtime (wine, winetricks, protontricks, umu) and a Proton version manager.
PACKAGES_IF_AVAILABLE="proton-cachyos-slr cachyos-gaming-meta protonup-qt"
FLATPAKS="net.lutris.Lutris com.heroicgameslauncher.hgl"
SETUP="bin/prime-gaming setup"
TEARDOWN="bin/prime-gaming teardown"
CHECK="bin/prime-gaming check"
