# Prime gaming pack — window manager settings (on while the pack is on).
# Prime's defaults already make Steam games fullscreen, tear-free-optional and
# lock-proof; this adds what only gamers want.

general {
    allow_tearing = true      # windows marked "immediate" below may tear: lowest input lag
}
misc {
    vrr = 2                   # FreeSync/G-Sync in fullscreen windows only (no desktop flicker)
}
render {
    direct_scanout = 2        # fullscreen games skip the compositor when they can
}

# FPS overlay: loaded into games but hidden until you switch it on (Super+Alt+H)
env = MANGOHUD,1

# Games from Lutris/Heroic/Wine run as "<name>.exe": low latency, no lock while focused
windowrule = immediate on, match:class ^(.*\.exe)$
windowrule = idle_inhibit focus, match:class ^(.*\.exe)$
# Steam: small windows float like dialogs; Big Picture (TV/controller mode) is fullscreen
windowrule = float on, match:class ^(steam)$, match:title ^(Friends List|Steam Settings|Properties.*|Screenshot Manager|Steam - News.*)$
windowrule = fullscreen on, match:class ^(steam)$, match:title ^(Steam Big Picture Mode)$
windowrule = idle_inhibit always, match:class ^(steam)$, match:title ^(Steam Big Picture Mode)$

bindd = SUPER ALT, G, Gaming menu, exec, ~/.local/share/prime-linux/layer/bin/prime-menu --section gaming
bindd = SUPER ALT, P, Performance mode on/off, exec, ~/.local/share/prime-linux/layer/addons/gaming/bin/prime-gaming perf toggle
bindd = SUPER ALT, H, FPS overlay in games on/off, exec, ~/.local/share/prime-linux/layer/addons/gaming/bin/prime-gaming hud toggle
