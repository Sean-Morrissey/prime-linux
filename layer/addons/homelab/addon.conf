# Homelab pack — read by prime-addon (see docs/PACKS.md for every field).
KIND=pack
TITLE="Homelab"
ICON="󰒋"
DESCRIPTION="Turn this computer into something that keeps running: containers, file sync between your machines, backups that actually restore, and a way to reach it from anywhere"
# Containers: rootless Podman, same choice the Coding pack makes — no daemon and
# no admin group, so a service can't quietly become root on the machine.
# Syncthing: folders that stay the same on every computer you own, directly
# between them, with no account and nothing stored on someone else's server.
# restic: backups that are encrypted, de-duplicated and can be restored from.
# Tailscale: reach this machine from your phone or another computer without
# opening a port on the router. It is installed, not switched on — signing in is
# the person's decision.
PACKAGES="podman podman-compose syncthing restic rsync openssh tailscale btop ncdu duf"
SETUP="bin/prime-homelab setup"
TEARDOWN="bin/prime-homelab teardown"
CHECK="bin/prime-homelab check"
