# Maker pack — read by prime-addon (see docs/PACKS.md for every field).
KIND=pack
TITLE="Maker"
ICON="󰹛"
DESCRIPTION="3D printing and design: slicers that turn a model into something your printer can print, CAD for drawing parts, and a viewer for the files you download"
# Slicing: OrcaSlicer (Flathub) is the one most current printers want — Bambu,
# Elegoo, Creality, Prusa all have profiles for it. PrusaSlicer from the repos
# is the fallback and what Prusa printers ship with.
# Drawing: FreeCAD for parts you measure, OpenSCAD for parts you describe in
# code, Blender for shapes you sculpt.
# f3d opens an .stl or .3mf straight from the file manager, so a downloaded
# model can be looked at without launching a slicer.
PACKAGES="prusa-slicer freecad openscad blender f3d"
FLATPAKS="com.orcaslicer.OrcaSlicer"
SETUP="bin/prime-maker setup"
TEARDOWN="bin/prime-maker teardown"
CHECK="bin/prime-maker check"
