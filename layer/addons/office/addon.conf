# Office pack — read by prime-addon (see docs/PACKS.md for every field).
KIND=pack
TITLE="Office"
ICON="󰈙"
DESCRIPTION="Documents, spreadsheets and slides, email, a scanner, and the PDF tools — everything for ordinary work, set up to open the files people send you"
# LibreOffice reads and writes Word, Excel and PowerPoint files; the setup step
# makes those the default so a .docx from someone else just opens.
# Thunderbird is the mail client; simple-scan drives a scanner over USB or the
# network; papers reads PDFs, pdfarranger merges and splits them, xournalpp
# fills in and signs them.
PACKAGES="libreoffice-fresh hunspell hunspell-en_us hyphen hyphen-en thunderbird simple-scan papers pdfarranger xournalpp"
SETUP="bin/prime-office setup"
TEARDOWN="bin/prime-office teardown"
CHECK="bin/prime-office check"
