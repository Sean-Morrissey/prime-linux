# Privacy pack — read by prime-addon (see docs/PACKS.md for every field).
KIND=pack
TITLE="Privacy"
ICON="󰒃"
DESCRIPTION="A password manager, encrypted folders, a VPN that stays on, and a way to strip the hidden details out of a file before you send it"
# KeePassXC: the passwords live in one file you keep, not someone's cloud.
# gocryptfs: a folder that is unreadable until you unlock it — no partitioning.
# Seahorse: the GUI for the keyring and SSH/GPG keys Prime already uses.
# mat2: strips camera model, location and author out of a photo or document.
# The VPN pieces are the NetworkManager plugins, so a .ovpn or WireGuard file
# imports in Settings and reconnects itself — no terminal needed.
PACKAGES="keepassxc gocryptfs seahorse mat2 pwgen age wireguard-tools openvpn networkmanager-openvpn"
SETUP="bin/prime-privacy setup"
TEARDOWN="bin/prime-privacy teardown"
CHECK="bin/prime-privacy check"
