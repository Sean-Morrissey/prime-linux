# Prime student pack — shortcuts (on while the pack is on).
bindd = SUPER ALT, S, Study menu, exec, ~/.local/share/prime-linux/layer/bin/prime-menu --section student
bindd = SUPER ALT, F, Focus mode on/off, exec, ~/.local/share/prime-linux/layer/addons/student/bin/prime-student focus toggle
bindd = SUPER ALT, N, Open your notes, exec, ~/.local/share/prime-linux/layer/bin/prime-addon open obsidian
bindd = SUPER ALT, T, Ask the study tutor, exec, ~/.local/share/prime-linux/layer/addons/student/bin/prime-student tutor
