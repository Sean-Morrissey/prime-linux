# Prime Linux — what starts with the session. The bar, dock, clipboard
# history, volume/brightness popups and low-battery warning are systemd user services (prime-*.service), so they restart on
# their own if they crash; everything else starts here.
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = systemctl --user start prime-session.target
exec-once = systemctl --user start hyprpolkitagent
exec-once = swaync -c ~/.local/share/prime-linux/layer/default/swaync/config.json -s ~/.config/prime/theme/swaync.css
exec-once = hyprpaper -c ~/.config/prime/theme/hyprpaper.conf
exec-once = $bin/prime-idle
# night light comes back on if it was on when you logged out
exec-once = $bin/prime-toggle restore
exec-once = hyprctl setcursor Breeze_Light 24
# title bars plugin: loads it, or builds it once for this Hyprland (first login),
# then a quiet health check that notifies only about problems it couldn't fix itself
exec-once = $bin/prime-titlebars
exec-once = $bin/prime-doctor --login
# the first-run welcome (runs once; Settings → Users & Accounts → "Set up my computer again" re-opens it)
exec-once = $bin/prime-welcome --first-run
