# Prime Linux — keyboard shortcuts. Super+/ shows all of them, searchable.
# Add or override your own in ~/.config/hypr/hyprland.conf (`unbind = …` first
# to replace one of these).

# ── Find & launch ────────────────────────────────────────────────────────────
bindd = SUPER, space, Prime Search — apps · files · maths · web, exec, $bin/prime-spotlight
bindd = SUPER ALT, space, Settings — everything about this computer, exec, $bin/prime-system-settings
bindd = SUPER, X, Start menu — pinned apps · all apps · recent files, exec, $bin/prime-start
bindd = SUPER, A, All applications, exec, $bin/prime-start --all
bindd = SUPER, I, Settings — everything about this computer, exec, $bin/prime-system-settings
bindd = SUPER, slash, Keyboard shortcuts (this list), exec, $bin/prime-keys
bindd = SUPER ALT, B, The bar from the keyboard — every item and its menu, exec, $bin/prime-bar --keys

# ── Apps ─────────────────────────────────────────────────────────────────────
bindd = SUPER, Return, Terminal, exec, $terminal
bindd = SUPER, T, Terminal, exec, $terminal
bindd = SUPER, E, Files, exec, $files
bindd = SUPER, B, Web browser, exec, $bin/prime-browser
bindd = SUPER, V, Clipboard history, exec, $bin/prime-clip-picker
bindd = SUPER, K, Notification centre, exec, swaync-client -t -sw
bindd = SUPER, H, Desktop health check, exec, $bin/prime-doctor
bindd = CTRL SHIFT, Escape, Activity — what is using the computer, exec, $bin/prime-activity

# ── Look ─────────────────────────────────────────────────────────────────────
bindd = SUPER SHIFT, W, Theme — wallpaper · accent colour · text size, exec, $bin/prime-theme
bindd = SUPER, W, Restart the bar, exec, $bin/prime-bar restart

# ── Screenshots ──────────────────────────────────────────────────────────────
bindd = , Print, Screenshot a region, exec, $bin/prime-snip area
bindd = SHIFT, Print, Screenshot everything, exec, $bin/prime-snip full
bindd = SUPER, Print, Screenshot this window, exec, $bin/prime-snip window
bindd = ALT, Print, Screenshot this monitor, exec, $bin/prime-snip screen
bindd = SUPER SHIFT, S, Screenshot a region, exec, $bin/prime-snip area

# ── Record, pick, type ───────────────────────────────────────────────────────
bindd = SUPER SHIFT, R, Record a region of the screen (press again to stop), exec, $bin/prime-record toggle area
bindd = SUPER CTRL SHIFT, R, Record the whole screen with sound (press again to stop), exec, $bin/prime-record toggle screen --sound
bindd = SUPER SHIFT, C, Pick a colour from the screen (copies its code), exec, $bin/prime-colour
bindd = SUPER CTRL, E, Emoji picker, exec, $bin/prime-emoji
bindd = , XF86Calculator, Calculator, exec, gnome-calculator

# ── Quick switches ───────────────────────────────────────────────────────────
bindd = SUPER CTRL, N, Night light on / off, exec, $bin/prime-toggle nightlight
bindd = SUPER CTRL, I, Keep awake on / off (no dimming or screen lock), exec, $bin/prime-toggle idle
bindd = SUPER SHIFT, K, Do not disturb on / off, exec, $bin/prime-toggle dnd
bindd = SUPER CTRL, space, Next keyboard layout, exec, $bin/prime-keyboard next

# ── Seeing ───────────────────────────────────────────────────────────────────
binded = SUPER ALT, equal, Magnify the screen (zoom in), exec, $bin/prime-zoom in
binded = SUPER ALT, minus, Zoom out, exec, $bin/prime-zoom out
bindd = SUPER ALT, 0, Normal size (no magnifier), exec, $bin/prime-zoom reset

# ── Windows ──────────────────────────────────────────────────────────────────
bindd = SUPER, Q, Close window, killactive
bindd = SUPER, F, Full screen on / off, fullscreen, 0
bindd = SUPER SHIFT, F, Maximise on / off (keeps the bar), fullscreen, 1
bindd = SUPER SHIFT, V, Float / tile window, togglefloating
bindd = SUPER, J, Make this the main window (left half), layoutmsg, swapwithmaster
bindd = SUPER, P, Pin window to all workspaces, pin
bindd = SUPER, minus, Minimise window, movetoworkspacesilent, special:minimized
bindd = SUPER, backspace, Show minimised windows, togglespecialworkspace, minimized
bindd = ALT, Tab, Switch window, exec, hyprctl --batch "dispatch cyclenext ; dispatch bringactivetotop"
bindd = SUPER, Tab, Next window, cyclenext

bindd = SUPER, left, Snap window to the left half (main), exec, $bin/prime-snap l
bindd = SUPER, right, Snap window to the right half, exec, $bin/prime-snap r
bindd = SUPER, up, Snap window up (top of the right half), exec, $bin/prime-snap u
bindd = SUPER, down, Snap window down (bottom of the right half), exec, $bin/prime-snap d
bindd = SUPER SHIFT, left, Focus the window to the left, movefocus, l
bindd = SUPER SHIFT, right, Focus the window to the right, movefocus, r
bindd = SUPER SHIFT, up, Focus the window above, layoutmsg, cycleprev
bindd = SUPER SHIFT, down, Focus the window below, layoutmsg, cyclenext
binded = SUPER CTRL, left, Narrower, resizeactive, -40 0
binded = SUPER CTRL, right, Wider, resizeactive, 40 0
binded = SUPER CTRL, up, Shorter, resizeactive, 0 -40
binded = SUPER CTRL, down, Taller, resizeactive, 0 40

bindmd = SUPER, mouse:272, Drag to move window, movewindow
bindmd = SUPER SHIFT, mouse:273, Drag to resize window, resizewindow
bindd = SUPER, mouse:273, Desktop menu, exec, $bin/prime-desktop-menu

# ── Monitors ─────────────────────────────────────────────────────────────────
bindd = SUPER, comma, Focus previous monitor, focusmonitor, -1
bindd = SUPER, period, Focus next monitor, focusmonitor, +1
bindd = SUPER ALT, left, Send window to previous monitor, movewindow, mon:-1
bindd = SUPER ALT, right, Send window to next monitor, movewindow, mon:+1

# ── Workspaces ───────────────────────────────────────────────────────────────
bindd = SUPER, 1, Go to workspace 1, focusworkspaceoncurrentmonitor, 1
bindd = SUPER, 2, Go to workspace 2, focusworkspaceoncurrentmonitor, 2
bindd = SUPER, 3, Go to workspace 3, focusworkspaceoncurrentmonitor, 3
bindd = SUPER, 4, Go to workspace 4, focusworkspaceoncurrentmonitor, 4
bindd = SUPER, 5, Go to workspace 5, focusworkspaceoncurrentmonitor, 5
bindd = SUPER, 6, Go to workspace 6, focusworkspaceoncurrentmonitor, 6
bindd = SUPER, 7, Go to workspace 7, focusworkspaceoncurrentmonitor, 7
bindd = SUPER, 8, Go to workspace 8, focusworkspaceoncurrentmonitor, 8
bindd = SUPER, 9, Go to workspace 9, focusworkspaceoncurrentmonitor, 9
bindd = SUPER, 0, Go to workspace 10, focusworkspaceoncurrentmonitor, 10
bindd = SUPER SHIFT, 1, Send window to workspace 1, movetoworkspace, 1
bindd = SUPER SHIFT, 2, Send window to workspace 2, movetoworkspace, 2
bindd = SUPER SHIFT, 3, Send window to workspace 3, movetoworkspace, 3
bindd = SUPER SHIFT, 4, Send window to workspace 4, movetoworkspace, 4
bindd = SUPER SHIFT, 5, Send window to workspace 5, movetoworkspace, 5
bindd = SUPER SHIFT, 6, Send window to workspace 6, movetoworkspace, 6
bindd = SUPER SHIFT, 7, Send window to workspace 7, movetoworkspace, 7
bindd = SUPER SHIFT, 8, Send window to workspace 8, movetoworkspace, 8
bindd = SUPER SHIFT, 9, Send window to workspace 9, movetoworkspace, 9
bindd = SUPER SHIFT, 0, Send window to workspace 10, movetoworkspace, 10
bindd = SUPER, mouse_down, Next workspace, workspace, e+1
bindd = SUPER, mouse_up, Previous workspace, workspace, e-1

# ── Hardware keys (laptops, media keyboards) ─────────────────────────────────
bindeld = , XF86AudioRaiseVolume, Volume up, exec, $bin/prime-osd volume up
bindeld = , XF86AudioLowerVolume, Volume down, exec, $bin/prime-osd volume down
bindld = , XF86AudioMute, Mute, exec, $bin/prime-osd volume mute
bindld = , XF86AudioMicMute, Mute microphone, exec, $bin/prime-osd mic mute
bindeld = , XF86MonBrightnessUp, Brightness up, exec, $bin/prime-osd brightness up
bindeld = , XF86MonBrightnessDown, Brightness down, exec, $bin/prime-osd brightness down
bindld = , XF86AudioPlay, Play / pause, exec, playerctl play-pause
bindld = , XF86AudioPause, Play / pause, exec, playerctl play-pause
bindld = , XF86AudioNext, Next track, exec, playerctl next
bindld = , XF86AudioPrev, Previous track, exec, playerctl previous
bindd = , XF86ScreenSaver, Lock screen, exec, loginctl lock-session
bindd = SUPER, L, Lock screen, exec, loginctl lock-session

# While the Prime screen saver covers a locking screen (prime-lock): no shortcuts at
# all, so nothing can be started behind it. prime-lock always returns to "reset".
submap = prime-locked
# (Hyprland only registers a submap that has a bind: this one is the single shortcut)
bindd = SUPER, L, While the screen saver shows: the password screen now, exec, $bin/prime-lock --now
submap = reset
