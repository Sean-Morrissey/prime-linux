# Prime Linux — idle: dim at 9 min; lock at 10, showing the Prime screen saver
# (any key or movement asks for the password); screens off at 20.
# Override in ~/.config/hypr/hypridle.conf (prime-linux only seeds it once).
general {
    lock_cmd = pidof hyprlock || ~/.local/share/prime-linux/layer/bin/prime-lock
    # going to sleep: straight to the password screen (no screen saver to wake into)
    before_sleep_cmd = ~/.local/share/prime-linux/layer/bin/prime-lock --now
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

# tell logind the person is away after 5 minutes, so nightly updates can tell
# "away" from "watching a video" before the screen locks
listener {
    timeout = 300
    on-timeout = loginctl set-idle-hint true
    on-resume  = loginctl set-idle-hint false
}

listener {
    timeout = 540
    on-timeout = brightnessctl -s set 30%
    on-resume  = brightnessctl -r
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# screens off: the screen saver stops (prime-lock then shows the password screen
# underneath, so the session stays locked) and the monitors sleep
listener {
    timeout = 1200
    on-timeout = ~/.local/share/prime-linux/layer/bin/prime-screensaver --stop; sleep 1; hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on && brightnessctl -r
}
