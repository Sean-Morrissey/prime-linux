# Prime Linux — idle: dim at 9 min, lock at 10, screens off at 11.
# Override in ~/.config/hypr/hypridle.conf (prime-linux only seeds it once).
general {
    lock_cmd = pidof hyprlock || hyprlock -c ~/.local/share/prime-linux/layer/default/hypr/hyprlock.conf
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

listener {
    timeout = 540
    on-timeout = brightnessctl -s set 30%
    on-resume  = brightnessctl -r
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 660
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on && brightnessctl -r
}
