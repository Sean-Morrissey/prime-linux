# Prime Linux — lock screen. Wallpaper + accent come from the theme switcher.
source = ~/.config/prime/theme/hyprlock.conf

general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = $wallpaper
    blur_passes = 2
    blur_size = 5
    contrast = 0.8
    brightness = 0.6
    vibrancy = 0.15
}

image {
    monitor =
    path = ~/.config/prime/theme/mark.png
    size = 72
    rounding = 0
    border_size = 0
    position = 0, 260
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 0.95)
    font_size = 72
    font_family = Inter Bold
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = rgba(200, 200, 205, 0.85)
    font_size = 22
    font_family = Inter
    position = 0, 40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 52
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.18
    dots_center = true
    outer_color = $accent
    check_color = $accent
    inner_color = rgb(15, 15, 15)
    font_color = rgb(240, 240, 240)
    fail_color = rgb(255, 69, 58)
    fade_on_empty = true
    placeholder_text = <i>Password</i>
    fail_text = <i>Wrong password</i>
    position = 0, -60
    halign = center
    valign = center
}
