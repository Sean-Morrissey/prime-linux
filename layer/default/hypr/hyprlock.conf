# Prime — lock screen. Wallpaper, accent and every text size come from Theme
# (~/.config/prime/theme/hyprlock.conf, written by prime-theme).
source = ~/.config/prime/theme/hyprlock.conf

general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = $wallpaper
    blur_passes = 2
    blur_size = 5
    contrast = 0.8
    brightness = 0.6
    vibrancy = 0.15
}

# the Prime emblem and name, so the lock screen says whose it is
image {
    monitor =
    path = ~/.config/prime/theme/mark.png
    size = 64
    rounding = 0
    border_size = 0
    position = 0, 300
    halign = center
    valign = center
}

label {
    monitor =
    text = Prime
    color = rgba(255, 255, 255, 0.90)
    font_size = $prime_font_name
    font_family = Inter SemiBold
    position = 0, 240
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 0.95)
    font_size = $prime_font_clock
    font_family = Inter Bold
    position = 0, 130
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    color = rgba(200, 200, 205, 0.85)
    font_size = $prime_font_date
    font_family = Inter
    position = 0, 45
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 52
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.18
    dots_center = true
    outer_color = $accent
    check_color = $accent
    inner_color = rgb(15, 15, 15)
    font_color = rgb(240, 240, 240)
    font_family = Inter
    fail_color = rgb(255, 69, 58)
    capslock_color = rgb(251, 191, 36)
    fade_on_empty = false
    placeholder_text = Password
    fail_text = Wrong password — try again
    position = 0, -60
    halign = center
    valign = center
}

# states in words, not only in the field's colour: Caps Lock, and how to get in
label {
    monitor =
    text = cmd[update:400] ~/.local/share/prime-linux/layer/bin/prime-lock-status
    color = rgba(251, 191, 36, 0.95)
    font_size = $prime_font_hint
    font_family = Inter Medium
    position = 0, -115
    halign = center
    valign = center
}

label {
    monitor =
    text = Type your password and press Enter to unlock
    color = rgba(200, 200, 205, 0.70)
    font_size = $prime_font_hint
    font_family = Inter
    position = 0, 40
    halign = center
    valign = bottom
}
