# Prime Linux — keyboard, mouse, touchpad. Change your layout in
# ~/.config/hypr/hyprland.conf (e.g. kb_layout = de) — that file wins.
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    accel_profile = flat
    touchpad {
        natural_scroll = true
        clickfinger_behavior = true
        tap-to-click = true
    }
}

gesture = 3, horizontal, workspace
