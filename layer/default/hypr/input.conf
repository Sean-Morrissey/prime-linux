# Prime Linux — keyboard, mouse, touchpad. Keyboard layouts: Menu → Settings →
# Keyboard layout (writes ~/.config/hypr/keyboard.conf, which wins over this).
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    accel_profile = flat
    touchpad {
        natural_scroll = true
        clickfinger_behavior = true
        tap-to-click = true
    }
}

gesture = 3, horizontal, workspace
