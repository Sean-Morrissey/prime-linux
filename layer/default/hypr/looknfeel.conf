# Prime Linux — look and feel: frosted glass, soft shadows, spring animations.
# The accent colour ($accent) comes from the theme switcher (Super+Shift+W).

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 1
    col.active_border = rgba(ffffff44) $accent_border 45deg
    col.inactive_border = rgba(ffffff10)
    resize_on_border = true
    extend_border_grab_area = 15
    hover_icon_on_border = true
    layout = dwindle
}

layerrule = blur waybar
layerrule = blur swaync-control-center
layerrule = blur swaync-notification-window
layerrule = blur rofi
layerrule = blur prime-spotlight
layerrule = blur prime-start

decoration {
    rounding = 14
    active_opacity = 0.96
    inactive_opacity = 0.88
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 28
        render_power = 4
        color = rgba(00000055)
        color_inactive = rgba(00000025)
    }

    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        noise = 0.01
        contrast = 1.0
        brightness = 0.95
        vibrancy = 0.25
    }
}

animations {
    enabled = yes
    bezier = ease, 0.16, 1, 0.3, 1
    bezier = spring, 0.05, 0.9, 0.1, 1.05
    bezier = smoothOut, 0.25, 0, 0, 1

    animation = windows,      1, 4, spring, popin 85%
    animation = windowsOut,   1, 3, smoothOut, popin 85%
    animation = windowsMove,  1, 4, ease
    animation = border,       1, 5, ease
    animation = fade,         1, 3, ease
    animation = workspaces,   1, 4, ease, slide
    animation = layers,       1, 4, ease, fade
}

dwindle {
    preserve_split = true
    smart_resizing = true
    use_active_for_splits = true
}

master {
    mfact = 0.55
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    focus_on_activate = true
}
