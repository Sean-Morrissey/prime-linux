# Prime Linux — window title bars with macOS-style buttons (hyprbars, via hyprpm).
# prime-guard enables/rebuilds the plugin; this block styles it once loaded.
plugin {
    hyprbars {
        enabled = true
        bar_height = 26
        bar_color = rgba(10, 10, 14, 0.95)
        bar_blur = false
        col.text = rgb(ececef)
        # text size comes from Theme → Text size (~/.config/prime/theme/hyprland.conf)
        bar_text_size = $prime_titlebar_text
        bar_text_font = Inter Medium
        bar_text_align = center
        bar_buttons_alignment = left
        bar_padding = 14
        bar_button_padding = 10
        bar_precedence_over_border = true
        bar_part_of_window = true
        inactive_button_color = rgb(a1a1a6)
        on_double_click = $bin/prime-hypr dispatch fullscreen 1

        # red / yellow / green, left to right: close · minimise · zoom. Each also
        # carries its symbol, so the buttons never rely on colour alone. The same
        # actions are on the keyboard: Super+Q, Super+minus, Super+F (Super+/ lists them).
        hyprbars-button = rgb(ff5f57), 13, ✕, $bin/prime-hypr dispatch killactive, rgba(0, 0, 0, 0.65)
        hyprbars-button = rgb(ffbd2e), 13, −, $bin/prime-window minimise, rgba(0, 0, 0, 0.65)
        hyprbars-button = rgb(28c840), 13, +, $bin/prime-hypr dispatch fullscreen 1, rgba(0, 0, 0, 0.65)
    }
}
