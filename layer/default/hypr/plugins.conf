# Prime Linux — window title bars with macOS-style buttons (hyprbars, via hyprpm).
# prime-guard enables/rebuilds the plugin; this block styles it once loaded.
plugin {
    hyprbars {
        enabled = true
        bar_height = 26
        bar_color = rgba(20, 20, 26, 0.95)
        bar_blur = true
        col.text = rgb(e4e4e7)
        bar_text_size = 11
        bar_text_font = Inter Medium
        bar_text_align = center
        bar_buttons_alignment = left
        bar_padding = 12
        bar_button_padding = 8
        bar_precedence_over_border = true
        bar_part_of_window = true
        inactive_button_color = rgb(6e6e73)
        on_double_click = hyprctl dispatch fullscreen 1

        # red / yellow / green, left to right: close · minimise · zoom
        hyprbars-button = rgb(ff5f57), 12, , hyprctl dispatch killactive
        hyprbars-button = rgb(ffbd2e), 12, , hyprctl dispatch movetoworkspacesilent special:minimized
        hyprbars-button = rgb(28c840), 12, , hyprctl dispatch fullscreen 1
    }
}
