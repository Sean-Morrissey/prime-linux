# Prime Linux — window title bars with Prime's own buttons (hyprbars, via hyprpm).
# prime-guard enables/rebuilds the plugin; this block styles it once loaded.
plugin {
    hyprbars {
        enabled = true
        bar_height = 26
        bar_color = rgba(20, 20, 26, 0.95)
        bar_blur = true
        col.text = rgb(e4e4e7)
        # text size comes from Theme → Text size (~/.config/prime/theme/hyprland.conf)
        bar_text_size = $prime_titlebar_text
        bar_text_font = Inter Medium
        bar_text_align = center
        bar_buttons_alignment = right
        bar_padding = 12
        bar_button_padding = 8
        bar_precedence_over_border = true
        bar_part_of_window = true
        inactive_button_color = rgba(255, 255, 255, 0.05)
        on_double_click = hyprctl dispatch fullscreen 1

        # Prime's buttons: quiet glass circles on the right, each with its symbol, read
        # left to right as minimise · maximise · close (the first one listed sits at the
        # edge). The same actions are on the keyboard: Super+minus, Super+Shift+F,
        # Super+Q (Super+/ lists them).
        hyprbars-button = rgba(ffffff1a), 16, ✕, hyprctl dispatch killactive, rgb(e4e4e7)
        hyprbars-button = rgba(ffffff1a), 16, □, hyprctl dispatch fullscreen 1, rgb(e4e4e7)
        hyprbars-button = rgba(ffffff1a), 16, −, hyprctl dispatch movetoworkspacesilent special:minimized, rgb(e4e4e7)
    }
}
