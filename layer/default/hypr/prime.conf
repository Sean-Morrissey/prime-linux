# Prime Linux — the defaults, in load order. ~/.config/hypr/hyprland.conf
# sources this file first, then your own settings, so yours always win.
# Don't edit files in ~/.local/share/prime-linux: `prime-update` replaces them.

$prime    = ~/.local/share/prime-linux/layer
$bin      = ~/.local/share/prime-linux/layer/bin
$terminal = kitty
$files    = nemo

source = ~/.config/prime/theme/hyprland.conf
source = ~/.local/share/prime-linux/layer/default/hypr/env.conf
source = ~/.local/share/prime-linux/layer/default/hypr/looknfeel.conf
source = ~/.local/share/prime-linux/layer/default/hypr/input.conf
source = ~/.local/share/prime-linux/layer/default/hypr/windows.conf
source = ~/.local/share/prime-linux/layer/default/hypr/bindings.conf
source = ~/.local/share/prime-linux/layer/default/hypr/autostart.conf
source = ~/.local/share/prime-linux/layer/default/hypr/plugins.conf
