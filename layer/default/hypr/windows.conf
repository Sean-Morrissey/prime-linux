# Prime Linux — window rules.

# Settings-style tools float, like dialogs
windowrule = float on, match:class ^(org.pulseaudio.pavucontrol|pavucontrol)$
windowrule = size 720 520, match:class ^(org.pulseaudio.pavucontrol|pavucontrol)$
windowrule = float on, match:class ^(blueman-manager|.blueman-manager-wrapped)$
windowrule = float on, match:class ^(nm-connection-editor)$
windowrule = float on, match:class ^(nwg-displays)$
windowrule = float on, match:class ^(org.gnome.Calculator|gnome-calculator)$
# the calendar the clock opens: a window of its own, centred, not a tile
windowrule = float on, match:class ^(org.gnome.Calendar|prime-calendar)$
windowrule = center on, match:class ^(org.gnome.Calendar|prime-calendar)$
windowrule = size 980 680, match:class ^(org.gnome.Calendar)$
windowrule = size 380 420, match:class ^(prime-calendar)$
windowrule = float on, match:class ^(system-config-printer)$
windowrule = float on, match:class ^(org.gnome.FileRoller|file-roller)$
windowrule = float on, match:class ^(prime-float)$
windowrule = size 1000 640, match:class ^(prime-float)$
windowrule = center on, match:class ^(prime-float)$
# Prime's own windows: task panel, password prompt, Activity
windowrule = float on, match:class ^(prime-panel|prime-activity)$
windowrule = center on, match:class ^(prime-panel|prime-activity)$
windowrule = size 720 520, match:class ^(prime-panel)$
windowrule = size 760 560, match:class ^(prime-activity)$

# Games: fullscreen, tearing allowed, never idle-lock mid-game
windowrule = fullscreen 1, match:class ^(steam_app_.*|gamescope)$
windowrule = immediate on, match:class ^(steam_app_.*|gamescope)$
windowrule = idle_inhibit always, match:class ^(steam_app_.*|gamescope)$
# Video in any browser: don't dim or lock while it's fullscreen
windowrule = idle_inhibit fullscreen, match:class .*
