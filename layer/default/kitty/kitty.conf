# Prime Linux — kitty defaults. Your own settings: ~/.config/kitty/kitty.conf
# (it includes this file first, then the theme, then your lines win).

font_family             JetBrainsMono Nerd Font
font_size               12.0
modify_font             cell_height 112%
window_padding_width    14
hide_window_decorations yes
confirm_os_window_close 0
remember_window_size    no
initial_window_width    1100
initial_window_height   640
background_opacity      0.94
cursor_shape            beam
cursor_beam_thickness   1.8
mouse_hide_wait         2.0
tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_min_tabs        2
scrollback_lines        20000
wheel_scroll_multiplier 5.0
copy_on_select          clipboard
enable_audio_bell       no
shell_integration       enabled

# Prime dark palette (matches the bar and menus); accent lines come from the theme
foreground              #e4e4e7
background              #0a0a0e
selection_foreground    #0a0a0e
inactive_tab_foreground #a1a1a6
inactive_tab_background #1c1c21
tab_bar_background      #0a0a0e
inactive_border_color   #2a2a30
color0   #1c1c21
color8   #52525b
color1   #f87171
color9   #fca5a5
color2   #34d399
color10  #6ee7b7
color3   #fbbf24
color11  #fde047
color4   #60a5fa
color12  #93c5fd
color5   #c084fc
color13  #d8b4fe
color6   #2dd4bf
color14  #5eead4
color7   #e4e4e7
color15  #fafafa

# Mac-style copy/paste as well as the Linux terminal keys
map super+c             copy_to_clipboard
map super+v             paste_from_clipboard
map ctrl+shift+c        copy_to_clipboard
map ctrl+shift+v        paste_from_clipboard
map ctrl+shift+t        new_tab
map ctrl+shift+w        close_tab
