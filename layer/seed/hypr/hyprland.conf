# Your Hyprland settings. Prime Linux's defaults load first; anything you put
# below overrides them. This file is yours — `prime-update` never touches it.
#   Every shortcut:  Super+/        Settings menu:  Super+Alt+Space
#   Docs: https://wiki.hypr.land/Configuring/

source = ~/.local/share/prime-linux/layer/default/hypr/prime.conf

# Screens — arranged with Settings → Displays, which rewrites monitors.conf.
monitor = , preferred, auto, 1
source = ~/.config/hypr/monitors.conf

# Written by the installer for this machine's GPU (safe to delete).
source = ~/.config/hypr/hardware.conf

# Optional add-ons (`prime-addon list`) add their lines here.
source = ~/.config/hypr/addons.conf

# ── Your changes go below ────────────────────────────────────────────────────
# input {
#     kb_layout = us
# }
# unbind = SUPER, T
# bind = SUPER, T, exec, konsole
# bind = SUPER, M, exec, spotify-launcher
