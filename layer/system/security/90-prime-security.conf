# Prime Linux — network hardening that never gets in the way of games, Steam,
# Docker, virtual machines or development tools. Installed by prime-security.
#
# Deliberately NOT here (they break things people use):
#   kernel.unprivileged_userns_clone=0  breaks Flatpak, Steam's runtime, Chrome's sandbox
#   kernel.yama.ptrace_scope=2/3         breaks debuggers and some game overlays
#   net.ipv4.ip_forward=0                breaks Docker, libvirt and hotspot sharing
# CachyOS/Arch already set the rest (kptr_restrict, dmesg_restrict, protected_*,
# unprivileged BPF off, TIOCSTI off, syncookies, rp_filter).

# This is a desktop, not a router: never send ICMP redirects …
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
# … and never let another machine on the network re-route our traffic with them.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
# Source-routed packets are only ever used for spoofing.
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0
# Protect TCP connections against TIME-WAIT assassination (RFC 1337).
net.ipv4.tcp_rfc1337 = 1
