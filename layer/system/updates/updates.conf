# Prime Linux — automatic updates.
# Easiest way to change these: Settings → Updates.
# Or edit this file as administrator; it is read at every run (no restart needed).
# Values that aren't valid are ignored (the default is used instead).

# What Prime does by itself:
#   auto      install updates during update hours, snapshot first (recommended)
#   ask       tell me when updates are ready; I click Install
#   security  only when a security fix is waiting (full update at least every SECURITY_MAX_DAYS)
#   off       never update by itself
POLICY=auto

# Update hours (24h clock). Off at night? It catches up after CATCH_UP_DAYS,
# at a moment nobody is using the computer (screen locked or idle IDLE_MINUTES).
WINDOW_START=3
WINDOW_END=6
CATCH_UP_DAYS=2
IDLE_MINUTES=20

# No pop-ups during these hours — you get a summary when you next log in.
QUIET_START=22
QUIET_END=8

# Laptops: on battery, only update above this charge (percent).
MIN_BATTERY=50
# Refuse to start below this much free disk space (GB).
MIN_FREE_GB=5
# Safety snapshot before installing: auto (whenever the disk can) | require | off
SNAPSHOTS=auto
# Also update App Store (Flatpak) apps.
FLATPAK=yes
# Mention waiting AUR updates. AUR packages are never installed unattended:
# they are built from scripts written by volunteers and nobody checks them first.
AUR_NOTIFY=yes
# No big downloads on a metered (pay-per-GB / phone hotspot) connection.
SKIP_ON_METERED=yes
SECURITY_MAX_DAYS=30
# After this many failed automatic runs in a row, stop and ask a person.
FAIL_LIMIT=2
NOTIFY=yes
# The account whose AUR helper (paru) is asked about AUR updates.
MAIN_USER=
