# Prime Linux — swaync's own unit, pointed at Prime's config and colours.
#
# This unit is the only thing that starts swaync: prime-session.target wants it,
# and D-Bus starts it too if a notification arrives before the session is up (at
# login the health check can beat it). Both routes are the same unit, so neither
# can race the other. It used to also be an exec-once in autostart.conf, which
# did race it — the loser quit with "already running", and when the loser was
# the service, systemd retried five times and left it failed for the session.
[Service]
ExecStart=
ExecStart=/usr/bin/swaync -c %h/.local/share/prime-linux/layer/default/swaync/config.json -s %h/.config/prime/theme/swaync.css
