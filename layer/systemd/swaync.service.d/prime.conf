# Prime Linux — a notification sent before the session's own swaync starts
# (the login health check, an app) makes D-Bus start swaync.service on its own.
# Without this it would come up with swaync's stock look, and the session's
# swaync would then quit with "already running". Same config either way.
[Service]
ExecStart=
ExecStart=/usr/bin/swaync -c %h/.local/share/prime-linux/layer/default/swaync/config.json -s %h/.config/prime/theme/swaync.css
