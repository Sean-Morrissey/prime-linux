# Prime OS — which boot menu the installer offers
#
# Frozen copy of CachyOS's own file (cachyos-calamares 3.4.2-4,
# etc/calamares/modules/packagechooser_bootloader.conf), with the descriptions rewritten
# into plain language and the default left as the owner decision.
#
# Two rules govern the text here:
#   * every word the user reads is theirs to act on — no jargon, no loader trivia. The
#     repo's A4 gate forbids bootc/ostree/systemd/polkit and requires a grade-8 reading
#     level, and a student choosing a boot menu is exactly who that gate protects.
#   * every option must say what the menu does for THEM: Windows, Prime, and a way back.
#
# `refind-ai` ("rEFInd + AI SDK") is dropped from the list on purpose: a second AI runtime
# on a student's machine is not our product, and an unfamiliar option at install time is
# noise. Add it back only with a reason.
---
mode: required
method: legacy
labels:
    step: "Boot menu"
default: limine
items:
    - id: grub
      name: "GRUB"
      description: "Works on nearly every computer. When you turn the machine on it shows Windows, Prime, and an earlier copy of Prime you can pick if an update ever breaks something."
      screenshot: "/etc/calamares/images/bootloaders/grub.jxl"
    - id: systemd-boot
      name: "systemd-boot"
      efiOnly: true
      description: "The simplest and fastest choice. Shows a short menu: Windows, Prime, and the last version that worked. Pick this if the other options have trouble with your computer."
      screenshot: "/etc/calamares/images/bootloaders/systemd-boot.jxl"
    - id: limine
      name: "Limine"
      description: "A newer choice. It finds your Windows install and your earlier copies of Prime by itself and puts them in the menu, so nothing has to be set up by hand."
      screenshot: "/etc/calamares/images/bootloaders/limine.jxl"
    - id: refind
      name: "rEFInd"
      efiOnly: true
      description: "A picture-based picker that lists everything it can find on the computer. Good to look at, but the menu is busier than the others."
      screenshot: "/etc/calamares/images/bootloaders/refind.jxl"

# DEFAULT: limine — CachyOS's own default, and the one whose snapshot entries and Windows
# detection exist without us writing anything. Sean's reference machine runs systemd-boot
# instead, where the single rollback entry is generated by `prime-pc`, so the two options
# cost very different amounts of work. See ../../../docs/DUALBOOT.md before changing this.
