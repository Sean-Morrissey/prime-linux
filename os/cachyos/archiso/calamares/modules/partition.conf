#
# Prime OS — partitioning, for a machine that already has Windows on it.
#
# Frozen copy of CachyOS's own file (cachyos-calamares 3.4.2-4), unchanged in every value;
# the comments marked PRIME are ours. Calamares replaces config files whole, so this file
# has to stay complete — editing it down to "the keys we care about" would silently drop
# the rest.
#
# PRIME — the rules this file exists to enforce on a Windows dual-boot machine:
#   1. NEVER pre-select a destructive layout. `initialPartitioningChoice: none` is a
#      safety property, not a default: it means the user has to look at the page and
#      choose. With Windows on the disk, anything else risks handing a stranger a
#      one-click "erase everything".
#   2. The existing EFI partition is REUSED, never reformatted. `efiSystemPartitionSize`
#      only applies when one is created — Windows' own ESP is usually 100–260 MB, and it
#      will be mounted as /boot with our kernel and boot entries added beside Windows' own
#      directory. If that partition is too small for a kernel + initramfs, STOP and tell
#      the user; do not shrink, move or recreate a partition that another OS boots from.
#   3. Free space has to already exist. Prime does not resize the Windows partition.
#      Windows' own Disk Management can shrink it safely; the installer's job is to say so
#      in plain language and offer "make room in Windows first" rather than doing surgery.
#   4. Install alongside, not replace — the user must never have to know the difference
#      between the two, so the wording on the page matters as much as this file.

# This setting specifies the mount point of the EFI system partition. Some
# distributions (Fedora, Debian, Manjaro, etc.) use /boot/efi, others (KaOS,
# etc.) use just /boot.
#
# Defaults to "/boot/efi", may be empty (but weird effects ensue)
efiSystemPartition:     "/boot"

efiSystemPartitionSize:     2048M

# efiSystemPartitionName:     EFI

userSwapChoices:
    - none      # Create no swap, use no swap
#    - small     # Up to 4GB
#    - suspend   # At least main memory size
#    - reuse     # Re-use existing swap, but don't create any (unsupported right now)
#    - file      # To swap file instead of partition

# This setting specifies the LUKS generation (i.e LUKS1, LUKS2) used internally by
# cryptsetup when creating an encrypted partition.
#
# This option is set to luks1 by default, as grub doesn't support LUKS2 + Argon2id
# currently. On the other hand grub does support LUKS2 with PBKDF2 and could therefore be
# also set to luks2. Also there are some patches for grub and Argon2.
# See: https://aur.archlinux.org/packages/grub-improved-luks2-git
#
# Choices: luks1, luks2 (in addition, "luks" means "luks1")
#
# The default is luks1
#
luksGeneration: luks2

# This setting determines if encryption should be allowed when using zfs.  This
# setting has no effect unless zfs support is provided.
#
# This setting is to handle the fact that some bootloaders(such as grub) do not
# support zfs encryption.
#
# The default is true
#
allowZfsEncryption: true

# Correctly draw nested (e.g. logical) partitions as such.
drawNestedPartitions:   false

# Show/hide partition labels on manual partitioning page.
alwaysShowPartitionLabels: true

# PRIME — see rule 1 above. Do not set this to a partitioning scheme on a target that may
# already hold another operating system.
initialPartitioningChoice: none

initialSwapChoice: none

# PRIME — btrfs, because the rollback promise is built on snapshots
# (snapper + snap-pac + cachyos-snapper-support, see ../../../docs/DUALBOOT.md).
defaultFileSystemType:  "btrfs"

defaultPartitionTableType: gpt

availableFileSystemTypes:  ["btrfs","xfs","ext4","f2fs","zfs"]

#enableLuksAutomatedPartitioning:    true

# Override some top-level values depending on user selected bootloader.
bootloaderOverrides:
    - name: grub
      allowZfsEncryption: false
      defaultFileSystemType:  "btrfs"
      availableFileSystemTypes:  ["btrfs","xfs","ext4","f2fs","zfs"]
      efiSystemPartition: "/boot/efi"
      efiSystemPartitionSize: 512M
      luksGeneration: luks2
      initialSwapChoice: none
      initialPartitioningChoice: none
    - name: limine
      allowZfsEncryption: true
      defaultFileSystemType:  "btrfs"
      availableFileSystemTypes:  ["btrfs","xfs","ext4","f2fs","zfs"]
      efiSystemPartition: "/boot"
      efiSystemPartitionSize: 4096M
      luksGeneration: luks2
      initialSwapChoice: none
      initialPartitioningChoice: none
    # PRIME — systemd-boot has no override here, so it inherits the top-level values
    # (/boot, 2048M) which is what the reference machine does. Left as-is deliberately;
    # adding a block here changes what the installer creates on a fresh disk.
