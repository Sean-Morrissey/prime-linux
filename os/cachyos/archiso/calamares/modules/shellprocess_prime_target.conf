---
# Prime OS: applied inside the installed system, right after the packages are in place.
# Mirrors CachyOS's own shellprocess modules in shape and behaviour.
#
# The script is run as an argument to bash rather than as a program: mkarchiso copies airootfs
# with `--no-preserve=mode`, so it arrives in the live image as 0644 and would not be directly
# executable.
dontChroot: false
timeout: 300
script:
    - command: "/bin/bash /etc/calamares/scripts/prime-target-setup"
    - "-rm /etc/calamares/scripts/prime-target-setup"
i18n:
    name: "Applying Prime's update-recovery settings"
    name[de]: "Prime-Einstellungen zur Update-Wiederherstellung werden angewendet"
