# #######################################################################################
# PRIME OS - HYPRLAND CONFIG (APPLE macOS SEQUOIA EDITION)
# Frosted Glass · Fluid Physics · Elegant Ergonomics
# #######################################################################################

source = ~/.cache/wal/colors-hyprland.conf

################
### MONITORS ###
################

monitor=@MONITORS@
monitor=@MONITORS@

###################
### MY PROGRAMS ###
###################

$terminal = konsole
$fileManager = nemo
$menu = @HOME@/.config/hypr/scripts/launcher.sh

#################
### AUTOSTART ###
#################

# Critical UI Services & Environment
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user enable --now hyprpolkitagent
exec-once = blueman-applet
exec-once = swaync

# CachyOS / WhiteSur Dark Theme Initialization
exec-once = gsettings set org.gnome.desktop.interface gtk-theme 'WhiteSur-Dark' 2>/dev/null || true
exec-once = gsettings set org.gnome.desktop.interface icon-theme 'WhiteSur' 2>/dev/null || true
exec-once = gsettings set org.gnome.desktop.interface font-name 'Inter 10' 2>/dev/null || true

# Wallpaper and Status Bar
exec-once = hyprpaper
exec-once = sleep 1 && hyprctl hyprpaper wallpaper "@MONITOR_2@,@WALLPAPER@"
exec-once = sleep 1 && hyprctl hyprpaper wallpaper "@MONITOR_1@,@WALLPAPER@"
exec-once = pkill -f kded6; bash ~/.config/waybar/scripts/restart-bars.sh

# Clipboard and Utils
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = wl-clip-persist --clipboard regular
exec-once = hypridle
exec-once = ~/.config/hypr/scripts/prime-rgb.sh

# Cursor
exec-once = hyprctl setcursor Bibata-Modern-Classic 24

# Load plugins (hyprbars traffic-light buttons, etc.)
exec-once = sleep 1 && hyprpm reload

#############################
### PLUGINS ###
#############################

plugin {
    hyprbars {
        # macOS Traffic-Light Header
        bar_height = 24
        bar_color = rgba(20, 20, 26, 0.95)
        col.text = rgb(e4e4e7)
        bar_text_size = 10
        bar_text_font = Inter Medium
        bar_button_padding = 8
        bar_padding = 12
        
        # Integration settings
        bar_precedence_over_border = true
        bar_part_of_window = true
        
        # macOS Traffic Light Buttons
        # Red: Close
        hyprbars-button = rgb(ff5f57), 10, , hyprctl dispatch killactive
        # Yellow: Minimize to scratchpad
        hyprbars-button = rgb(ffbd2e), 10, , hyprctl dispatch movetoworkspacesilent special:minimized
        # Green: Fullscreen
        hyprbars-button = rgb(28c840), 10, , hyprctl dispatch fullscreen 1
    }
}

#############################
### ENVIRONMENT VARIABLES ###
#############################

# GPU Optimization (RX 9060 XT)
env = MESA_VK_DEVICE_SELECT,1002:7590!
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# Toolkits and Windowing
env = QT_QPA_PLATFORM,wayland;xcb
env = GDK_BACKEND,wayland,x11,*
env = SDL_VIDEODRIVER,wayland,x11
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1

# Electron / Firefox native Wayland
env = NIXOS_OZONE_WL,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = MOZ_ENABLE_WAYLAND,1

# Hardware video decode (VA-API / VDPAU → radeonsi)
env = LIBVA_DRIVER_NAME,radeonsi
env = VDPAU_DRIVER,radeonsi

# Scaling and UI Fixes for XWayland (Steam)
env = GDK_SCALE,1
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = AMD_VULKAN_ICD,RADV

#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 1
    
    # Apple Glassmorphic Silver & Blue hairline border
    col.active_border = rgba(ffffff44) rgba(0a84ff66) 45deg
    col.inactive_border = rgba(ffffff10)
    
    resize_on_border = true
    extend_border_grab_area = 15
    hover_icon_on_border = true
    layout = dwindle
}

# Frosted-glass blur for waybar & swaync layers
layerrule = blur waybar
layerrule = blur swaync-control-center
layerrule = blur swaync-notification-window

decoration {
    rounding = 14
    active_opacity = 0.96
    inactive_opacity = 0.88
    fullscreen_opacity = 1.0

    # Apple-grade soft drop shadow
    shadow {
        enabled = true
        range = 28
        render_power = 4
        color = rgba(00000055)
        color_inactive = rgba(00000025)
    }

    # Deep macOS Frosted Acrylic Blur
    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        xray = false
        noise = 0.01
        contrast = 1.0
        brightness = 0.95
        vibrancy = 0.25
    }
}

animations {
    enabled = yes

    bezier = appleEase, 0.16, 1, 0.3, 1
    bezier = appleSpring, 0.05, 0.9, 0.1, 1.05
    bezier = smoothOut, 0.25, 0, 0, 1

    animation = windows,      1, 4, appleSpring, popin 85%
    animation = windowsOut,   1, 3, smoothOut, popin 85%
    animation = windowsMove,  1, 4, appleEase
    animation = border,       1, 5, appleEase
    animation = fade,         1, 3, appleEase
    animation = workspaces,   1, 4, appleEase, slide
    animation = layers,       1, 4, appleEase, fade
}

dwindle {
    preserve_split = true
    smart_split = false
    smart_resizing = true
    use_active_for_splits = true
}

master {
    mfact = 0.55
    new_status = master
    orientation = left
    smart_resizing = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    vrr = 0
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    focus_on_activate = true
}

debug {
    vfr = true
}

render {
    direct_scanout = false
}

#############
### INPUT ###
#############

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    accel_profile = flat
    touchpad {
        natural_scroll = true
        clickfinger_behavior = true
    }
}

###################
### KEYBINDINGS ###
###################

$mainMod = SUPER

# Core Apps & Spotlight
bind = $mainMod, Space, exec, $menu
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, T, exec, $terminal
bind = $mainMod, B, exec, google-chrome-stable
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, exec, cliphist list | $HOME/.config/prime/rofi-hint.sh -dmenu -p "󰅌 Clipboard" -theme ~/.config/rofi/prime-spotlight.rasi | cliphist decode | wl-copy
bind = $mainMod SHIFT, V, togglefloating
bind = $mainMod, Q, killactive
bind = $mainMod, F, fullscreen, 1
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, K, exec, swaync-client -t -sw
bind = $mainMod, W, exec, bash ~/.config/waybar/scripts/restart-bars.sh
bind = $mainMod SHIFT, W, exec, bash @HOME@/.config/hypr/scripts/wallpaper-switcher.sh

# Screenshots / snips
#   Print        drag a box, then an action sheet (Ask Prime · whiteboard · annotate)
#   Shift+Print  whole desktop
#   Super+Print  just the focused window
#   Super+P      the focused monitor
#   Super+Alt+A  drag a box and ask Hermes about it straight away
#   Super+Alt+W  drag a box and have it worked out on Prime's Whiteboard
bind = , Print, exec, bash @HOME@/.config/hypr/scripts/prime-snip.sh area
bind = SHIFT, Print, exec, bash @HOME@/.config/hypr/scripts/prime-snip.sh full
bind = $mainMod, Print, exec, bash @HOME@/.config/hypr/scripts/prime-snip.sh window
bind = ALT, Print, exec, bash @HOME@/.config/hypr/scripts/prime-snip.sh screen
bind = $mainMod ALT, A, exec, bash @HOME@/.config/hypr/scripts/prime-snip.sh area --ask
bind = $mainMod ALT, W, exec, bash @HOME@/.config/hypr/scripts/prime-snip.sh area --board
bind = $mainMod SHIFT, S, exec, bash @HOME@/.config/hypr/scripts/prime-snip.sh area

# Prime Spotlight (Super+Space): the main search box. Typing finds applications,
# files and folders locally (no model round trip); anything with no local match
# falls through to Prime. /=web search, =2+2=arithmetic, >apps only. Esc closes.
bind = $mainMod, space, exec, @HOME@/.hermes/scripts/prime-spotlight.sh

# Utility apps
bind = $mainMod, H, exec, konsole --qwindowtitle dotfiles-floating -e @HOME@/.config/hypr/scripts/pc-health-check.sh
bind = $mainMod, G, exec, konsole --qwindowtitle gemini-cli -e @HOME@/.bun/bin/gemini --yolo
bind = $mainMod, S, exec, GTK_USE_PORTAL=0 GDK_BACKEND=x11 steam
bind = $mainMod, M, exec, spotify-launcher
bind = $mainMod, D, exec, ~/.config/discord/Discord
bind = $mainMod, O, exec, obsidian --no-sandbox
bind = $mainMod, C, exec, claude-desktop

# Prime hold-to-talk (system-wide): HOLD Super+R to listen, RELEASE to send.
#   bind    = fired once on press   -> prime-ptt-down.sh  (start recording)
#   bindrn  = fired once on release -> prime-ptt-up.sh    (stop + submit)
#
# Why two release binds (both non-consuming, so the letter R still types — a
# bind WITHOUT `n` suppresses the keypress even when it is release-only):
#   * `bindrn = $mainMod, R` matches when R comes up while Super is still held;
#   * `bindrn = , R`        matches when Super was let go first (modmask 0).
# KeybindManager only fires a release bind whose modmask matches the state at
# release (`key.modmaskAtPressTime` / the `ignoreMods` path), so covering both
# orderings is what makes "let go and it sends" reliable — whichever key he
# releases first. prime-ptt-up.sh is idempotent, so a double match is harmless.
#   bind    = fired once on press   -> prime-ptt-bind.sh press    (start)
#   bindrni = fired once on release -> prime-ptt-bind.sh release  (stop + send)
#
# `r` = release, `n` = non-consuming (R still types — without it even a
# release-only bind suppresses the keypress), `i` = ignore mods.
#
# `i` is the one that matters most and it fixes the "it only sends on a second
# press" bug exactly: ConfigManager only sets `modmaskAtPressTime` when the KEY
# goes down, and KeybindManager skips a release bind when that value doesn't
# match the release-time modmask — UNLESS ignoreMods is set. So when he pressed
# R a hair before Super (modmaskAtPressTime = 0) and let go while Super was still
# held (modmask = 64), every release bind was skipped: nothing fired at all until
# the next press. With `i`, the modmask is irrelevant and the release always
# lands.
binde   = $mainMod, R, exec, bash @HOME@/.hermes/scripts/prime-ptt-bind.sh press
bindrni = , R, exec, bash @HOME@/.hermes/scripts/prime-ptt-bind.sh release
# Super coming up on its own is the other reliable "he let go" signal.
bindrni = , Super_L, exec, bash @HOME@/.hermes/scripts/prime-ptt-bind.sh superup

# Window Switching & Management
bind = ALT, Tab, cyclenext
bind = ALT, Tab, bringactivetotop
bind = $mainMod, Tab, cyclenext

# Minimize to Scratchpad
bind = $mainMod, minus,     movetoworkspacesilent, special:minimized
bind = $mainMod, backspace, togglespecialworkspace, minimized
bind = $mainMod, P, pin

# Screen Lock (hardware key)
bind = , XF86ScreenSaver, exec, hyprlock

# Toggle split direction (side-by-side ↔ stacked)
bind = $mainMod, J, layoutmsg, togglesplit

# Directional Window Focus (Super + Arrows)
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

# Move Window Between Monitors (Super + Shift + Left/Right)
bind = $mainMod SHIFT, left,  movewindow, mon:-1
bind = $mainMod SHIFT, right, movewindow, mon:+1
# Move Window Within Workspace (Super + Shift + Up/Down)
bind = $mainMod SHIFT, up,    movewindow, u
bind = $mainMod SHIFT, down,  movewindow, d

# Resize Window (Super + Ctrl + Arrows)

# Mouse bindings
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod SHIFT, mouse:273, resizewindow
# Right-click with Super = the Prime context menu (Ask Prime · new file · new folder ·
# terminal here · clipboard · wallpaper). Resize lives on Super+Shift+right-drag now.
bind = $mainMod, mouse:273, exec, @HOME@/.config/prime/prime-desktop-menu.sh

# Focus monitor
bind = $mainMod, comma,  focusmonitor, -1
bind = $mainMod, period, focusmonitor, +1

##############################
### WINDOWS AND WORKSPACES ###
##############################

# Workspaces Monitor 1 (@MONITOR_2@ / Left 144Hz)
workspace = 1, monitor:@MONITOR_2@, default:true
workspace = 2, monitor:@MONITOR_2@
workspace = 3, monitor:@MONITOR_2@
workspace = 4, monitor:@MONITOR_2@
workspace = 5, monitor:@MONITOR_2@

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# Workspaces Monitor 2 (@MONITOR_1@ / Right)
workspace = 6, monitor:@MONITOR_1@, default:true
workspace = 7, monitor:@MONITOR_1@
workspace = 8, monitor:@MONITOR_1@
workspace = 9, monitor:@MONITOR_1@
workspace = 10, monitor:@MONITOR_1@

bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

####################
### WINDOW RULES ###
####################

# Floating Windows
windowrule = float on, match:class ^(pavucontrol)$
windowrule = size 700 500, match:class ^(pavucontrol)$
windowrule = float on, match:class ^(blueman-manager)$
windowrule = float on, match:class ^(nm-connection-editor)$

# Steam Games & Fullscreen Rules
windowrule = monitor @MONITOR_2@, match:class ^(steam_app_.*)$
windowrule = workspace 1, match:class ^(steam_app_.*)$
windowrule = fullscreen 1, match:class ^(steam_app_.*)$
windowrule = immediate on, match:class ^(steam_app_.*)$
windowrule = idle_inhibit always, match:class ^(steam_app_.*)$

windowrule = monitor @MONITOR_2@, match:initial_class ^(steam_app_.*)$
windowrule = workspace 1, match:initial_class ^(steam_app_.*)$
windowrule = fullscreen 1, match:initial_class ^(steam_app_.*)$

windowrule = monitor @MONITOR_2@, match:class ^(gamescope)$
windowrule = workspace 1, match:class ^(gamescope)$
windowrule = fullscreen 1, match:class ^(gamescope)$
windowrule = immediate on, match:class ^(gamescope)$

windowrule = monitor @MONITOR_2@, match:title ^(Expedition.*)$
windowrule = workspace 1, match:title ^(Expedition.*)$
windowrule = fullscreen 1, match:title ^(Expedition.*)$
