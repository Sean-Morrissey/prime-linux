general {
    no_fade_in = false
    grace = 0
    disable_loading = true
}

background {
    monitor =
    path = ~/.config/hypr/wallpapers/prime_os_red.png
    blur_passes = 2
    blur_size = 5
    contrast = 0.8
    brightness = 0.6
    vibrancy = 0.15
    vibrancy_darkness = 0.0
}

# Clock
label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 0.95)
    font_size = 72
    font_family = Inter Bold
    position = 0, 120
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = rgba(192, 192, 192, 0.85)
    font_size = 22
    font_family = Inter
    position = 0, 40
    halign = center
    valign = center
}

# Password input
input-field {
    monitor =
    size = 280, 52
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.18
    dots_center = true
    outer_color = rgb(179, 0, 0)
    inner_color = rgb(15, 15, 15)
    font_color = rgb(240, 240, 240)
    fade_on_empty = true
    placeholder_text = <i>Enter password...</i>
    hide_input = false
    check_color = rgb(179, 0, 0)
    fail_color = rgb(255, 50, 50)
    fail_text = <i>Wrong password</i>
    position = 0, -60
    halign = center
    valign = center
}
