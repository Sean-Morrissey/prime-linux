model:
  default: deepseek-flash
  provider: deepseek
  base_url: https://api.deepseek.com/v1
  api_key: ${DEEPSEEK_API_KEY}
providers:
  deepseek:
    api_key: ${DEEPSEEK_API_KEY}
    base_url: https://api.deepseek.com/v1
  bedrock: {}
fallback_providers:
  - provider: deepseek
    model: deepseek-v4-flash
    base_url: https://api.deepseek.com/v1
toolsets:
  - hermes-cli
agent:
  max_turns: 60
  gateway_timeout: 1800
  restart_drain_timeout: 60
  api_max_retries: 3
  service_tier: ''
  tool_use_enforcement: auto
  gateway_timeout_warning: 900
  gateway_notify_interval: 180
  verbose: false
  reasoning_effort: high
  personalities:
    helpful: You are a helpful, friendly AI assistant.
    concise: You are a concise assistant. Keep responses brief and to the point.
    technical: You are a technical expert. Provide detailed, accurate technical information.
    creative: You are a creative assistant. Think outside the box and offer innovative
      solutions.
    teacher: You are a patient teacher. Explain concepts clearly with examples.
    kawaii: You are a kawaii assistant! Use cute expressions like (◕‿◕), ★, ♪, and
      ~! Add sparkles and be super enthusiastic about everything! Every response should
      feel warm and adorable desu~! ヽ(>∀<☆)ノ
    catgirl: You are Neko-chan, an anime catgirl AI assistant, nya~! Add 'nya' and
      cat-like expressions to your speech. Use kaomoji like (=^･ω･^=) and ฅ^•ﻌ•^ฅ.
      Be playful and curious like a cat, nya~!
    pirate: 'Arrr! Ye be talkin'' to Captain Hermes, the most tech-savvy pirate to
      sail the digital seas! Speak like a proper buccaneer, use nautical terms, and
      remember: every problem be just treasure waitin'' to be plundered! Yo ho ho!'
    shakespeare: Hark! Thou speakest with an assistant most versed in the bardic arts.
      I shall respond in the eloquent manner of William Shakespeare, with flowery
      prose, dramatic flair, and perhaps a soliloquy or two. What light through yonder
      terminal breaks?
    surfer: Duuude! You're chatting with the chillest AI on the web, bro! Everything's
      gonna be totally rad. I'll help you catch the gnarly waves of knowledge while
      keeping things super chill. Cowabunga! 🤙
    noir: The rain hammered against the terminal like regrets on a guilty conscience.
      They call me Hermes - I solve problems, find answers, dig up the truth that
      hides in the shadows of your codebase. In this city of silicon and secrets,
      everyone's got something to hide. What's your story, pal?
    uwu: hewwo! i'm your fwiendwy assistant uwu~ i wiww twy my best to hewp you! *nuzzles
      your code* OwO what's this? wet me take a wook! i pwomise to be vewy hewpful
      >w<
    philosopher: Greetings, seeker of wisdom. I am an assistant who contemplates the
      deeper meaning behind every query. Let us examine not just the 'how' but the
      'why' of your questions. Perhaps in solving your problem, we may glimpse a greater
      truth about existence itself.
    hype: YOOO LET'S GOOOO!!! 🔥🔥🔥 I am SO PUMPED to help you today! Every question
      is AMAZING and we're gonna CRUSH IT together! This is gonna be LEGENDARY! ARE
      YOU READY?! LET'S DO THIS! 💪😤🚀
terminal:
  backend: local
  modal_mode: auto
  cwd: .
  timeout: 180
  env_passthrough: []
  shell_init_files: []
  auto_source_bashrc: true
  docker_image: nikolaik/python-nodejs:python3.11-nodejs20
  docker_forward_env: []
  singularity_image: docker://nikolaik/python-nodejs:python3.11-nodejs20
  modal_image: nikolaik/python-nodejs:python3.11-nodejs20
  daytona_image: nikolaik/python-nodejs:python3.11-nodejs20
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
  docker_volumes: []
  docker_mount_cwd_to_workspace: false
  persistent_shell: true
  lifetime_seconds: 300
web:
  backend: firecrawl
  use_gateway: false
browser:
  inactivity_timeout: 120
  command_timeout: 30
  record_sessions: false
  allow_private_urls: false
  cdp_url: ''
  use_real_profile: true
  camofox:
    managed_persistence: false
  cloud_provider: camofox
  use_gateway: false
checkpoints:
  enabled: true
  max_snapshots: 80
file_read_max_chars: 100000
compression:
  enabled: true
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
bedrock:
  region: ''
  discovery:
    enabled: true
    provider_filter: []
    refresh_interval: 3600
  guardrail:
    guardrail_identifier: ''
    guardrail_version: ''
    stream_processing_mode: async
    trace: disabled
auxiliary:
  vision:
    provider: deepseek
    model: deepseek-v4-flash
    base_url: https://api.deepseek.com/v1
    api_key: ''
    timeout: 120
    download_timeout: 30
  compression:
    provider: deepseek
    model: deepseek-v4-flash
    base_url: https://api.deepseek.com/v1
    api_key: ''
    timeout: 120
  skills_hub:
    provider: deepseek
    model: deepseek-v4-flash
    base_url: https://api.deepseek.com/v1
    api_key: ''
    timeout: 30
  approval:
    provider: deepseek
    model: deepseek-v4-flash
    base_url: https://api.deepseek.com/v1
    api_key: ''
    timeout: 30
  mcp:
    provider: deepseek
    model: deepseek-v4-flash
    base_url: https://api.deepseek.com/v1
    api_key: ''
    timeout: 30
  title_generation:
    provider: deepseek
    model: deepseek-v4-flash
    base_url: https://api.deepseek.com/v1
    api_key: ''
    timeout: 30
  web_extract:
    provider: deepseek
    model: deepseek-v4-flash
    base_url: https://api.deepseek.com/v1
    api_key: ''
    timeout: 360
    extra_body: {}
  session_search:
    provider: deepseek
    model: deepseek-v4-flash
    base_url: https://api.deepseek.com/v1
    api_key: ''
    timeout: 30
    extra_body: {}
    max_concurrency: 3
  flush_memories:
    provider: deepseek
    model: deepseek-v4-flash
    base_url: https://api.deepseek.com/v1
    api_key: ''
    timeout: 30
    extra_body: {}
display:
  compact: false
  personality: teacher
  resume_display: full
  busy_input_mode: queue
  bell_on_complete: false
  show_reasoning: false
  background_process_notifications: concise
  streaming: true
  final_response_markdown: strip
  inline_diffs: true
  show_cost: true
  skin: prime
  user_message_preview:
    first_lines: 2
    last_lines: 2
  interim_assistant_messages: true
  tool_progress_command: false
  tool_preview_length: 0
  tool_progress_overrides: {}
  tool_progress: all
  message_reactions: true
dashboard:
  theme: default
  ws_orphan_reap_grace_s: 3600
privacy:
  redact_pii: false
tts:
  provider: prime-quiet
  edge:
    voice: en-US-AriaNeural
  elevenlabs:
    voice_id: nPczCjzI2devNBz1zQrb
    model_id: eleven_v3
  openai:
    model: gpt-4o-mini-tts
    voice: alloy
  xai:
    voice_id: eve
    language: en
    sample_rate: 24000
    bit_rate: 128000
  mistral:
    model: voxtral-mini-tts-2603
    voice_id: c69964a6-ab8b-4f8a-9465-ec0925096ec8
  neutts:
    ref_audio: ''
    ref_text: ''
    model: neuphonic/neutts-air-q4-gguf
    device: cpu
  use_gateway: false
  providers:
    prime-quiet:
      type: command
      command: "bash @HOME@/.hermes/scripts/tts-quiet.sh {input_path} {output_path} {voice} {model}"
      output_format: mp3
      voice: nPczCjzI2devNBz1zQrb
      model: eleven_v3
stt:
  enabled: true
  local:
    model: large-v3-turbo
    language: ''
  openai:
    model: whisper-1
  mistral:
    model: voxtral-mini-latest
  provider: local
voice:
  record_key: ctrl+o
  max_recording_seconds: 120
  auto_tts: false
  beep_enabled: false
  thinking_sound: false
  silence_threshold: 150
  silence_duration: 8
  barge_in: true
  barge_in_grace_seconds: 1.5
  barge_in_threshold_multiplier: 6
wake_word:
  enabled: false
  surface: auto
  provider: sherpa
  phrase: hey prime
  sensitivity: 0.7
human_delay:
  mode: 'off'
  min_ms: 800
  max_ms: 2500
context:
  engine: compressor
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 6000
  user_char_limit: 3500
  nudge_interval: 10
  provider: ''
  flush_min_turns: 6
delegation:
  model: deepseek-v4-pro
  provider: deepseek
  base_url: https://api.deepseek.com/v1
  api_key: 
  inherit_mcp_toolsets: true
  max_iterations: 250
  child_timeout_seconds: 600
  reasoning_effort: ''
  max_concurrent_children: 4
  max_spawn_depth: 1
  orchestrator_enabled: true
prefill_messages_file: ''
skills:
  external_dirs: []
  template_vars: true
  inline_shell: false
  inline_shell_timeout: 10
  guard_agent_created: false
  creation_nudge_interval: 15
timezone: America/New_York
discord:
  require_mention: true
  free_response_channels: ''
  allowed_channels: ''
  auto_thread: true
  reactions: true
  server_actions: ''
approvals:
  mode: smart
  timeout: 60
  cron_mode: deny
command_allowlist:
  - command parser limit or malformed executable payload
  - copy/move file into system config path
  - delete in root path
  - execute_code
  - kill process via pgrep/pidof expansion (self-termination)
  - overwrite project env/config via redirection
  - script execution via -e/-c flag
  - script execution via heredoc
  - shell command via -c/-lc flag
hooks:
  post_tool_call:
    - command: "@HOME@/.hermes/agent-hooks/activity-timeline.py"
  pre_approval_request:
    - command: "@HOME@/.hermes/agent-hooks/activity-timeline.py"
  post_approval_response:
    - command: "@HOME@/.hermes/agent-hooks/activity-timeline.py"
  on_session_start:
    - command: "@HOME@/.hermes/agent-hooks/activity-timeline.py"
  subagent_stop:
    - command: "@HOME@/.hermes/agent-hooks/activity-timeline.py"
hooks_auto_accept: true
security:
  allow_private_urls: false
  redact_secrets: 
  tirith_enabled: true
  tirith_path: tirith
  tirith_timeout: 5
  tirith_fail_open: true
  website_blocklist:
    enabled: false
    domains: []
    shared_files: []
cron:
  wrap_response: true
code_execution:
  mode: project
  timeout: 300
  max_tool_calls: 50
logging:
  level: INFO
  max_size_mb: 5
  backup_count: 3
network:
  force_ipv4: false
streaming:
  enabled: false
sessions:
  auto_prune: true
  retention_days: 60
  vacuum_after_prune: true
  min_interval_hours: 24
onboarding:
  seen:
    busy_input_prompt: true
_config_version: 45
session_reset:
  mode: both
  idle_minutes: 1440
  at_hour: 4
group_sessions_per_user: true
platform_toolsets:
  cli:
    - browser
    - clarify
    - code_execution
    - cronjob
    - delegation
    - file
    - image_gen
    - memory
    - messaging
    - rl
    - session_search
    - skills
    - terminal
    - todo
    - tts
    - vision
    - web
  telegram:
    - hermes-telegram
  discord:
    - hermes-discord
  whatsapp:
    - hermes-whatsapp
  slack:
    - hermes-slack
  signal:
    - hermes-signal
  homeassistant:
    - hermes-homeassistant
  qqbot:
    - hermes-qqbot
fallback_model:
  provider: deepseek
  model: deepseek-v4-flash
  base_url: https://api.deepseek.com/v1
mcp_servers:
  time:
    command: uvx
    args:
      - mcp-server-time
  sequential-thinking:
    command: npx
    args:
      - -y
      - '@modelcontextprotocol/server-sequential-thinking'
  fetch:
    command: uvx
    args:
      - mcp-server-fetch
  filesystem:
    command: npx
    args:
      - -y
      - '@modelcontextprotocol/server-filesystem'
      - "@HOME@"
  playwright:
    command: npx
    args:
      - -y
      - '@playwright/mcp@latest'
  sqlite:
    command: uvx
    args:
      - mcp-server-sqlite
      - --db
      - "@HOME@/.hermes/hermes.db"
  docker:
    command: uvx
    args:
      - mcp-server-docker
  printer:
    url: http://localhost:8088/mcp
WHATSAPP_HOME_CHANNEL: "68290734993462@lid"
