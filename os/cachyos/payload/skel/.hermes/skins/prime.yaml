# ~/.hermes/skins/prime.yaml
# Prime — Prime blue, silver and deep navy (the same accent as the desktop).
# Activate:  /skin prime      (persists via display.skin in config.yaml)
# Pure data: no code changes needed, missing keys inherit from 'default'.

name: prime
description: Prime — Prime blue, silver and deep navy

colors:
  banner_border: "#1B4FA0"      # navy frame
  banner_title: "#60A5FA"       # Prime blue
  banner_accent: "#C9CFD6"      # chrome
  banner_dim: "#5B6B85"
  banner_text: "#E6E9ED"
  ui_accent: "#60A5FA"
  ui_label: "#7FA8DC"
  ui_ok: "#4CAF50"
  ui_error: "#EF5350"
  ui_warn: "#FFB300"
  prompt: "#E6E9ED"
  input_rule: "#1B4FA0"
  response_border: "#C9CFD6"
  session_label: "#60A5FA"
  session_border: "#2E5FA3"
  status_bar_bg: "#0F1420"
  voice_status_bg: "#0F1420"
  status_bar_text: "#C9CFD6"
  status_bar_strong: "#60A5FA"
  status_bar_dim: "#55709B"
  status_bar_good: "#6FCF97"
  status_bar_warn: "#FFC857"
  status_bar_bad: "#E57373"
  status_bar_critical: "#FF5252"
  selection_bg: "#23355C"
  completion_menu_bg: "#0F1420"
  completion_menu_current_bg: "#23355C"
  completion_menu_meta_bg: "#0F1420"
  completion_menu_meta_current_bg: "#23355C"
  shell_dollar: "#2E5FA3"

spinner:
  waiting_faces:
    - "(━)"
    - "(─)"
    - "(▪)"
    - "(•)"
  thinking_faces:
    - "(━)"
    - "(⌁)"
    - "(◆)"
    - "(═)"
    - "(▪)"
  thinking_verbs:
    - "thinking"
    - "looking into it"
    - "checking"
    - "working it out"
    - "lining things up"
    - "double-checking"
    - "tidying up"
    - "almost there"
  wings:
    - ["⟪⛨", "⛨⟫"]
    - ["⟪▸", "▸⟫"]
    - ["⟪◆", "◆⟫"]
    - ["⟪⬢", "⬢⟫"]

branding:
  agent_name: "Prime"
  welcome: "Prime online. I run this machine — what are we building?"
  goodbye: "Standing down. Ping me if anything breaks."
  response_label: " ⛨ Prime "
  prompt_symbol: "⛨"
  help_header: "(⛨) Available Commands"

tool_prefix: "▏"

tool_emojis:
  terminal: "⛨"
  read_file: "📄"
  write_file: "💾"
  patch: "🔧"
  web_search: "🔍"
  browser_navigate: "🌐"
  vision_analyze: "👁"
  delegate_task: "🤖"

