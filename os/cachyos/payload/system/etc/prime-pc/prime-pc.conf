# prime-pc — knobs for the machine supervisor on @USER@'s CachyOS desktop.
# This file is the user-facing control surface. Edit it, don't edit the script.
# Reload: nothing to do, the timer reads it every cycle.

# ---------------------------------------------------------------- autonomy
# suggest   — look, report, change nothing (the safe default)
# auto-user — apply updates unattended at a safe moment, never reboot
# auto-all  — as above, plus it may swap back from a bootable snapshot
# Destructive verbs (rollback/restore) always ask, at every level.
CAPABILITY="auto-user"

# ---------------------------------------------------------------- cadence
# The timer itself lives in /etc/systemd/system/prime-pc-update.timer.
# These are the gates it must clear before it is allowed to touch anything.
MIN_FREE_GB=15          # refuse below this much space on /
MAX_LOAD_FACTOR=1.0     # busy machine = skip (load1 must be under nproc × this)
SNAPSHOT_BEFORE="yes"   # take a labelled rollback point before the upgrade
AUR="yes"               # also update AUR packages via paru (as @USER@)
AUR_TIMEOUT_MIN=30      # give a build this long, then give up and report

# ---------------------------------------------------------------- notice
NOTIFY_LEDGER="yes"     # put the result in @USER@'s ledger → WhatsApp
REBOOT_NUDGE_HOURS=24   # don't repeat "reboot when you can" more often than this

# ---------------------------------------------------------------- disks
# Snapshots cover the root subvolume only. /home is a separate subvolume and is
# deliberately NOT snapshotted — those are large and change constantly; rolling
# the OS back must never touch @USER@'s files.
SNAP_CONFIG="root"
SNAP_NUMBER_LIMIT=50    # snapper prunes beyond this (oldest non-important first)
ROLLBACK_ENTRIES=1      # how many 'Prime rollback' lines may appear in the boot menu
                        # (older snapshots stay in snapper; 'prime-pc boot-entry <N>'
                        #  puts one back in the menu if you ever need it)
