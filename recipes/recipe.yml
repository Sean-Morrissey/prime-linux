---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# Prime Linux — student-first atomic desktop with a resident AI agent.
# Image publishes to ghcr.io/<your-github-user>/prime-linux
name: prime-linux
description: Prime Linux — a student-first atomic desktop that ships with a resident AI agent.

# Base: Bazzite (Universal Blue) — Fedora Atomic with KDE Plasma as the default
# desktop, plus drivers, codecs, flatpak setup, ujust helpers and a working gaming
# stack (Steam/Proton/Gamescope) out of the box.
#
# Why Bazzite for a student machine: a Linux laptop that can't run the games they
# already own gets dual-booted back to Windows within a month. Bazzite removes that
# excuse, broadens hardware support (handhelds, GPUs, laptops) and inherits the
# most actively tested Universal Blue surface. The cost is honest: a larger image
# and a pile of preinstalled gaming tooling we do not need for coursework.
#
#   Alternatives:
#     ghcr.io/ublue-os/bazzite-nvidia         -> Bazzite + NVIDIA driver stack
#     ghcr.io/ublue-os/bazzite-dx             -> Bazzite + developer tooling
#     ghcr.io/ublue-os/aurora                 -> leaner KDE, no gaming stack
#     ghcr.io/ublue-os/bluefin                -> GNOME instead of KDE
#     ghcr.io/blue-build/base-images/fedora-kinoite -> bare KDE, no extras
#
# Tags: `latest` tracks the newest stable build (currently Fedora 44); `stable` is
# the conservative alias. Pin a version tag instead of `latest` once this ships to
# someone else, so their machine only moves when we decide it moves.
base-image: ghcr.io/ublue-os/bazzite
image-version: latest

modules:
  # --- 1. The Prime layer: everything in files/system/ is copied over / ---------
  - type: files
    files:
      - source: system
        destination: /

  # --- 2. Packages ------------------------------------------------------------
  - type: dnf
    repos:
      copr:
        # Hyprland stack for the "Prime" session (Sean's desktop).
        # If this COPR breaks a build, comment out the copr entry + the hypr* packages
        # below and ship the KDE-only image until it is healthy again.
        - solopasha/hyprland
    install:
      packages:
        # Prime session (Hyprland)
        - hyprland
        - hyprpaper
        - hypridle
        - hyprlock
        - hyprpicker
        - xdg-desktop-portal-hyprland
        # Prime session shell + tools
        - waybar
        - fuzzel
        - kitty
        - grim
        - slurp
        - wl-clipboard
        - playerctl
        - brightnessctl
        # Student + dev basics
        - git
        - ripgrep
        - fd-find
        - jq
        - fastfetch
        - btop
        - tmux
        - python3-pip
        - nodejs
        - npm

  # --- 3. Agent runtime (Hermes) — installer fetched at build time -------------
  # TODO(phase 2): pin a version / vendor the installer instead of pulling latest.
  - type: script
    snippets:
      - "curl -LsSf https://astral.sh/uv/install.sh | UV_UNMANAGED_INSTALL=/usr/local sh"
      - "chmod +x /usr/libexec/prime/firstboot.sh /usr/libexec/prime/hw-probe.sh"

  # --- 4. Store apps the agent + student workflow lean on ---------------------
  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        install:
          - org.libreoffice.LibreOffice
          - md.obsidian.Obsidian
          - org.zotero.Zotero
          - com.github.tchx84.Flatseal

  # --- 5. First-boot wizard (per-user setup, never ships any secrets) ---------
  # TODO: Bazzite ships its own first-run welcome/portal tooling — disable it here
  # so two setup experiences don't race on first login.
  - type: systemd
    system:
      enabled:
        - prime-firstboot.service

  # --- 6. Signing so updates verify ------------------------------------------
  - type: signing
