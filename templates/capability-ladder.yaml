# Prime Linux — capability ladder
#
# Installed as ~/.config/prime/capabilities.yaml (by `prime-settings`, from the
# autonomy slider in Welcome) and editable by hand. Prime's toolbox
# (layer/default/prime-tools.json, run by layer/bin/prime-settings) checks it
# before every change it makes on the user's behalf. See docs/ASSISTANT.md.
#
# Levels, weakest to strongest:
#   observe      — may look, may report, may not change anything
#   suggest      — may propose an action and wait for a yes
#   approve-each — may act, but asks every single time
#   auto         — may act without asking, and says what it did afterwards
#
# Rules that override the slider:
#   * destructive.* is pinned at approve-each at EVERY autonomy level
#   * secrets.* is pinned at approve-each — reading or writing credentials always asks
#   * nothing may raise its own level; only the user can (Welcome, or
#     `prime-settings autonomy <level>`, which rewrites this file). No tool writes it,
#     and a restore of saved desktop settings never brings an old copy back.
#   * whatever the level, a change Prime proposes after reading content it didn't
#     write (a screenshot, a file, app or file names) always asks first
#
# autonomy: suggest  (default)  -> every capability at or below suggest
# autonomy: auto-user           -> user-space (settings.user, files.write, apps.install,
#                                    network.outbound) at auto, system.* at approve-each
# autonomy: auto-all            -> everything at auto except the pinned groups

version: 1
autonomy: suggest

capabilities:
  # --- reading
  system.read:
    level: observe
    note: hardware, update status, service health, logs, disk usage
  files.read:
    level: observe
    note: user's own home directory; prompts before leaving it
  screen.read:
    level: observe
    note: screenshot and read the screen on request

  # --- user-space writes
  files.write:
    level: suggest
    note: create and edit files in the user's home directory
  apps.install:
    level: suggest
    note: flatpaks and distrobox containers — reversible, no reboot
  settings.user:
    level: suggest
    note: user-space config (theme, dotfiles, app preferences)
  network.outbound:
    level: suggest
    note: web fetches and searches on the user's behalf

  # --- system-level, always needs a reboot to take effect
  system.packages:
    level: approve-each
    note: installs packages with pacman (packs that bring apps) — asks for the password
  system.update:
    level: approve-each
    note: run an update now, or change the nightly update policy (snapshot first)
  system.rollback:
    level: approve-each
    note: roll the system back to a snapshot — the undo path for updates

  # --- pinned: these never rise, at any autonomy level
  destructive.*:
    level: approve-each
    pinned: true
    note: deletes, wipes, restoring old desktop settings over the current ones, anything irreversible
  secrets.*:
    level: approve-each
    pinned: true
    note: API keys, passwords, tokens, SSH keys

audit:
  # every action Prime takes is appended here and readable in plain language
  log: ~/.config/prime/audit.jsonl
  retain_days: 90

spend:
  # hard ceiling on model calls, surfaced in the UI
  monthly_usd: 5.00
  warn_at_percent: 80
  on_exceed: pause        # pause | degrade-to-scripts
