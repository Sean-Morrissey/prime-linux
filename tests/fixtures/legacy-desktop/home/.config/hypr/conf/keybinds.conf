# the same as Prime's: nothing to bring over
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, 1, workspace, 1
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bindm = $mainMod, mouse:272, movewindow

# my apps
bind = $mainMod, F1, exec, steam
bind = $mainMod, F2, exec, spotify-launcher
bind = $mainMod, F3, exec, discord
bind = $mainMod, F4, exec, obsidian
bind = $mainMod CTRL, W, exec, $browser --new-window

# these clash with Prime's own keys
bind = $mainMod SHIFT, S, exec, steam -silent
bind = $mainMod ALT, G, exec, discord
bind = $mainMod, B, exec, $browser

# push to talk: hold F13 to speak, let go to send
binde = , F13, exec, ~/.hermes/scripts/ptt.sh start
bindrni = , F13, exec, ~/.hermes/scripts/ptt.sh stop

# whiteboard
bind = $mainMod CTRL SHIFT, B, exec, systemctl --user restart prime-whiteboard.service
