# Synthetic test fixture: a hand-built Hyprland desktop from before Prime Linux.
# Made up for tests/check-import.sh — no real person's settings or keys.

$mainMod = SUPER
$terminal = kitty
$browser = firefox

source = ~/.config/hypr/conf/monitors.conf
source = ./conf/keybinds.conf
source = conf/windowrules.conf
source = ~/.config/hypr/conf/autostart.conf

env = XCURSOR_SIZE,24
env = MESA_VK_DEVICE_SELECT,1002:7590
env = AMD_VULKAN_ICD,RADV
env = QT_STYLE_OVERRIDE,kvantum
# never copied: a key pasted straight into the config
env = OPENROUTER_API_KEY,sk-or-v1-FAKEFAKEFAKE0000test0000notarealkey

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(a78bfaff) rgba(f472b6ff) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

decoration {
    rounding = 10
    blur {
        enabled = true
        size = 6
    }
}

input {
    kb_layout = us,de
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    sensitivity = 0.2
}
